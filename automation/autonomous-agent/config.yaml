schemaVersion: 1
baseBranch: main
branchPrefix: agent/
localStateDirectory: .agent-state
roles:
  explorer:
    model: openai-codex/gpt-5.4-mini
    reasoning: medium
  planner:
    model: openai-codex/gpt-5.4
    reasoning: high
  planReviewer:
    model: openai-codex/gpt-5.6-sol
    reasoning: xhigh
  implementer:
    model: openai-codex/gpt-5.6-sol
    reasoning: high
  codeReviewer:
    model: openai-codex/gpt-5.6-terra
    reasoning: xhigh
  documentation:
    model: openai-codex/gpt-5.4
    reasoning: high
  governanceReviewer:
    model: openai-codex/gpt-5.6-sol
    reasoning: xhigh
limits:
  planReviewIterations: 3
  implementationReviewIterations: 4
  governanceReviewIterations: 2
  maxAgentTurnsPerStage: 20
  stageTimeoutMinutes: 25
  totalRuntimeMinutes: 120
  maxArtifactBytes: 256000
  maxRunBytes: 5000000
validation:
  extraCommands: []
