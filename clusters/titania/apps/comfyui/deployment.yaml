apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
    app.kubernetes.io/component: image-generation
    app.kubernetes.io/part-of: comfyui
spec:
  # ComfyUI on the sole B60 (plan 0029, ADR 0008). The GPU is time-shared with
  # intel-llama-ornith through Git: a PR sets this to 1 and Ornith to 0, or the reverse.
  # Both Deployments request gpu.intel.com/xe: 1 and the plugin advertises exactly one,
  # so the scheduler itself prevents the two from ever running at the same time.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: comfyui
      app.kubernetes.io/instance: comfyui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comfyui
        app.kubernetes.io/instance: comfyui
        app.kubernetes.io/component: image-generation
        app.kubernetes.io/part-of: comfyui
    spec:
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      initContainers:
        - name: model-download
          image: curlimages/curl@sha256:3b8fde20978e330b401837f24b871ebe2c8d14ff7f07b87990bcd832588a1a75
          command:
            - sh
          args:
            - -ec
            - |
              mkdir -p /models/host/checkpoints /models/host/loras /models/host/vae /models/host/upscale_models
              # start_comfyui.sh passes these paths and ComfyUI exits if they are missing on a fresh PVC.
              mkdir -p /data/input /data/output /data/user
              mkdir -p /models/host/diffusion_models /models/host/text_encoders
              fetch() { # path sha256 url
                f="/models/host/$1"
                # A file only gets its final name after its checksum passed, so existing files are not re-hashed.
                test -f "$f" && return 0
                curl --fail --location --retry 5 --output "$f.partial" "$3"
                echo "$2  $f.partial" | sha256sum -c -
                mv "$f.partial" "$f"
              }
              # SDXL 1.0 base (stabilityai, commit f298da3).
              fetch checkpoints/sd_xl_base_1.0.safetensors 31e35c80fc4829d14f90153f4c74cd59c90b779f6afe05a74cd6120b893f7e5b \
                https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0/resolve/f298da3c058bd8f1f1c62f3ecfa775244a243897/sd_xl_base_1.0.safetensors
              # RealVisXL V5.0 fp16 (SG161222, commit ac93e0d).
              fetch checkpoints/RealVisXL_V5.0_fp16.safetensors 6a35a7855770ae9820a3c931d4964c3817b6d9e3c6f9c4dabb5b3a94e5643b80 \
                https://huggingface.co/SG161222/RealVisXL_V5.0/resolve/ac93e0dda1f6d448cae19bbfab8c5e720a5e48bc/RealVisXL_V5.0_fp16.safetensors
              # Chroma1-HD (lodestones, commit 0e0c60e), its T5 encoder (fp8, to fit VRAM beside the model) and Flux VAE.
              fetch diffusion_models/Chroma1-HD.safetensors d446d9695d08276f61e53653e025289dd96f7a489c27982a1fa54ecabc06642a \
                https://huggingface.co/lodestones/Chroma1-HD/resolve/0e0c60ece1e82b17cb7f77342d765ba5024c40c0/Chroma1-HD.safetensors
              fetch text_encoders/t5xxl_fp8_e4m3fn.safetensors 7d330da4816157540d6bb7838bf63a0f02f573fc48ca4d8de34bb0cbfd514f09 \
                https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/6af2a98e3f615bdfa612fbd85da93d1ed5f69ef5/t5xxl_fp8_e4m3fn.safetensors
              fetch vae/ae.safetensors afc8e28272cd15db3919bacdb6918ce9c1ed22e96cb12c4d5ed0fba823529e38 \
                https://huggingface.co/lodestones/Chroma/resolve/2f3b2730d7b5edbd02cdff12f72610af5787300b/ae.safetensors
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
          volumeMounts:
            - name: models
              mountPath: /models/host
            - name: data
              mountPath: /data
      containers:
        - name: comfyui
          # Intel llm-scaler-omni 0.2.0-b2: the ComfyUI-only Battlemage image (ComfyUI 0.37.0,
          # torch XPU, omni_xpu_kernel attention, ComfyUI-OmniXPU, GGUF-XPU, nunchaku-XPU).
          # Pinned to the Docker Hub digest; Renovate tracks the tag.
          image: intel/llm-scaler-omni:0.2.0-b2@sha256:cc127efc23f8d6033d00e9d759468241ef478562ba63a56bb1dd8e83bbab46e3
          # The image ENTRYPOINT (omix_torch_runtime.sh) sets up the oneAPI/XPU runtime and execs
          # this. start_comfyui.sh adds --listen 0.0.0.0 --port 8188, the host-models path config,
          # /data/{input,output,user}, --enable-manager and DynamicVRAM with a reserve (below).
          args:
            - /llm/entrypoints/start_comfyui.sh
          env:
            # The image default. Chroma is 17.8 GB on a 24 GB card, and VRAM spill has taken this node down (ADR 0004).
            - name: OMNI_COMFYUI_RESERVE_VRAM_GB
              value: "4"
          ports:
            - name: http
              containerPort: 8188
          resources:
            requests:
              cpu: 2
              memory: 6Gi
              gpu.intel.com/xe: 1
            limits:
              cpu: 6
              # The node has about 20 GiB allocatable and Ornith is never co-resident (one xe resource).
              # Models are staged through host RAM on load; this leaves room for the node's other pods.
              memory: 16Gi
              gpu.intel.com/xe: 1
          # The GPU device plugin injects the allocated DRM nodes; no privileged access needed.
          # The image runs as root (no USER in the Dockerfile) and writes custom nodes under /llm.
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /system_stats
              port: http
            # Runtime bootstrap plus first-start node imports; the image is 7 GB and cold.
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /system_stats
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /system_stats
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            # /system_stats shares the Python process with model loading; allow 2 minutes of slow answers.
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models/host
              readOnly: true
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: comfyui-models
        - name: data
          persistentVolumeClaim:
            claimName: comfyui-data
        - name: dshm
          # Intel documents --shm-size=64g for multi-XPU; a single XPU needs far less, and this
          # emptyDir counts against the container memory limit.
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
