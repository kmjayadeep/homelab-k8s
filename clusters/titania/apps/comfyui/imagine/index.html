<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagine</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1c1c1a; --muted: #6d6d68; --panel: #fff; --line: #d9d9d3; --accent: #3a5bd9; --err: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ececE8; --muted: #9a9a93; --panel: #1f1f1d; --line: #35352f; --accent: #8aa2ff; --err: #ff9c94; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  textarea { width: 100%; min-height: 96px; padding: 12px; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  button { margin-top: 12px; width: 100%; padding: 12px; font: inherit; font-weight: 600; color: var(--bg); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  #status { min-height: 24px; margin: 12px 0; color: var(--muted); }
  #status.error { color: var(--err); }
  img { display: block; width: 100%; height: auto; border-radius: 8px; }
  a { color: var(--accent); }
  #save { display: inline-block; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Imagine</h1>
  <form id="form">
    <textarea id="prompt" required autofocus aria-label="Describe the image" placeholder="Describe the image"></textarea>
    <button id="go" type="submit">Generate</button>
  </form>
  <div id="status" role="status"></div>
  <img id="result" alt="Generated image" hidden>
  <a id="save" download hidden>Save image</a>
</main>
<script>
  // Chroma1-HD with the settings and negative prompt from its official ComfyUI workflow.
  const NEGATIVE = "This greyscale unfinished sketch has bad proportions, is featureless and disfigured. It is a blurry ugly mess and with excessive gaussian blur. It is riddled with watermarks and signatures. Everything is smudged with leaking colors and nonsensical orientation of objects. Messy and abstract image filled with artifacts disrupt the coherency of the overall composition. The image has extreme chromatic abberations and inconsistent lighting. Dull, monochrome colors and countless artistic errors.";
  const TIMEOUT_MS = 600000;

  const $ = (id) => document.getElementById(id);
  const setStatus = (text, isError) => { $("status").textContent = text; $("status").className = isError ? "error" : ""; };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function workflow(text) {
    return {
      "1": { class_type: "UNETLoader", inputs: { unet_name: "Chroma1-HD.safetensors", weight_dtype: "default" } },
      "2": { class_type: "CLIPLoader", inputs: { clip_name: "t5xxl_fp8_e4m3fn.safetensors", type: "chroma", device: "default" } },
      "3": { class_type: "T5TokenizerOptions", inputs: { clip: ["2", 0], min_padding: 1, min_length: 0 } },
      "4": { class_type: "VAELoader", inputs: { vae_name: "ae.safetensors" } },
      "5": { class_type: "ModelSamplingAuraFlow", inputs: { model: ["1", 0], shift: 1 } },
      "6": { class_type: "CLIPTextEncode", inputs: { clip: ["3", 0], text } },
      "7": { class_type: "CLIPTextEncode", inputs: { clip: ["3", 0], text: NEGATIVE } },
      "8": { class_type: "EmptySD3LatentImage", inputs: { width: 1024, height: 1024, batch_size: 1 } },
      "10": { class_type: "CFGGuider", inputs: { model: ["5", 0], positive: ["6", 0], negative: ["7", 0], cfg: 3.8 } },
      "11": { class_type: "KSamplerSelect", inputs: { sampler_name: "euler" } },
      "12": { class_type: "BetaSamplingScheduler", inputs: { model: ["5", 0], steps: 26, alpha: 0.45, beta: 0.45 } },
      "13": { class_type: "RandomNoise", inputs: { noise_seed: Math.floor(Math.random() * 2 ** 48) } },
      "14": { class_type: "SamplerCustomAdvanced", inputs: { noise: ["13", 0], guider: ["10", 0], sampler: ["11", 0], sigmas: ["12", 0], latent_image: ["8", 0] } },
      "15": { class_type: "VAEDecode", inputs: { samples: ["14", 0], vae: ["4", 0] } },
      "9": { class_type: "SaveImage", inputs: { images: ["15", 0], filename_prefix: "imagine" } },
    };
  }

  async function generate(text) {
    const res = await fetch("comfy/prompt", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: workflow(text) }) });
    if (res.status === 502 || res.status === 503 || res.status === 504) throw new Error("ComfyUI is not running. The GPU may be assigned to the LLM.");
    if (!res.ok) throw new Error("ComfyUI rejected the request (HTTP " + res.status + ").");
    const id = (await res.json()).prompt_id;
    const started = Date.now();
    while (Date.now() - started < TIMEOUT_MS) {
      await sleep(700);
      setStatus("Generating… " + Math.round((Date.now() - started) / 1000) + " s");
      const poll = await fetch("comfy/history/" + id);
      if (!poll.ok) continue;
      const entry = (await poll.json())[id];
      if (!entry) continue;
      if (entry.status && entry.status.status_str === "error") throw new Error("Generation failed in ComfyUI.");
      if (entry.status && entry.status.completed) {
        const img = entry.outputs["9"].images[0];
        return { url: "comfy/view?" + new URLSearchParams(img), name: img.filename, seconds: Math.round((Date.now() - started) / 1000) };
      }
    }
    throw new Error("Timed out after 10 minutes.");
  }

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = $("prompt").value.trim();
    if (!text) return;
    $("go").disabled = true;
    setStatus("Starting…");
    try {
      const out = await generate(text);
      $("result").src = out.url;
      $("result").hidden = false;
      $("save").href = out.url;
      $("save").download = out.name;
      $("save").hidden = false;
      setStatus("Done in " + out.seconds + " s");
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      $("go").disabled = false;
    }
  });

  // Enter generates, Shift+Enter adds a new line.
  $("prompt").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("form").requestSubmit(); }
  });
</script>
</body>
</html>
