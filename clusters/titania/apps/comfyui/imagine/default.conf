upstream comfyui {
    server comfyui.comfyui.svc.cluster.local:8188;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The page only needs these three ComfyUI endpoints; nothing else is proxied.
    location = /comfy/prompt {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_set_header Origin "";
        proxy_pass http://comfyui/prompt;
    }

    location ~ ^/comfy/history/([0-9a-f-]+)$ {
        limit_except GET { deny all; }
        proxy_pass http://comfyui/history/$1;
    }

    location = /comfy/view {
        limit_except GET { deny all; }
        proxy_pass http://comfyui/view$is_args$args;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
