apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: comfyui

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - imagine.yaml

configMapGenerator:
  - name: imagine
    files:
      - imagine/index.html
      - imagine/default.conf
    options:
      labels:
        app.kubernetes.io/name: imagine
        app.kubernetes.io/instance: comfyui
