apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
spec:
  provider:
    vault:
      server: https://vault.vault.svc.cluster.local:8200
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        key: ca.crt
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: comfyui
          serviceAccountRef:
            name: external-secrets-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ui-basic-auth
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: ui-basic-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # ingress-nginx basic auth expects an htpasswd file under the key "auth".
        auth: "{{ htpasswd .username .password \"bcrypt\" }}"
  data:
    - secretKey: username
      remoteRef:
        key: apps/gpu-portal/ui-basic-auth
        property: username
    - secretKey: password
      remoteRef:
        key: apps/gpu-portal/ui-basic-auth
        property: password
