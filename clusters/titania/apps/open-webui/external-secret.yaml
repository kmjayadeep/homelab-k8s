apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: open-webui
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: open-webui
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: open-webui
          serviceAccountRef:
            name: external-secrets-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secrets-vault
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: open-webui-secrets-vault
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: apps/litellm/open-webui
        property: api_key
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: apps/open-webui/core
        property: webui_secret_key
