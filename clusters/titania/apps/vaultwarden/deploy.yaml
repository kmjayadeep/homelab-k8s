apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: vaultwarden
spec:
  # The single ReadWriteOnce Longhorn volume cannot attach to a second pod, so the old pod must stop
  # before the new one starts. RollingUpdate with maxSurge 0 does that. `type: Recreate` cannot be
  # applied here (PRs #653/#654 blocked the Kustomization from 2026-11-23): the live object's
  # maxSurge/maxUnavailable are owned by the `k3s` field manager, so Flux's server-side apply cannot
  # remove them, not even with `rollingUpdate: null`, and the API server rejects Recreate with them.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/instance: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: "vaultwarden/server:1.37.5"
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 500Mi
          env:
            - name: SIGNUPS_ALLOWED
              value: "true"
            - name: DOMAIN
              value: "https://vaultwarden.cosmos.cboxlab.com"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
          - name: data
            mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vaultwarden-pvc
