apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app: vaultwarden
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: vaultwarden
spec:
  # The single ReadWriteOnce Longhorn volume cannot attach to a second pod. With the default
  # RollingUpdate the surge pod stays Pending on a Multi-Attach error and the rollout hangs, so
  # replace the pod instead, like the other single-PVC apps here (bookorbit, uptime, wolf).
  strategy:
    type: Recreate
    # Explicit null: kustomize-controller applies with a strategic merge patch, which does not
    # drop keys this manifest omits. The live object still carries maxSurge/maxUnavailable from
    # its RollingUpdate days, and the merged result is rejected by the API server
    # ("spec.strategy.rollingUpdate: Forbidden: may not be specified when strategy `type` is
    # 'Recreate'"). Nulling the field removes it from the applied object. Revert with the type.
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/instance: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: "vaultwarden/server:1.37.5"
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 500Mi
          env:
            - name: SIGNUPS_ALLOWED
              value: "true"
            - name: DOMAIN
              value: "https://vaultwarden.cosmos.cboxlab.com"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
          - name: data
            mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vaultwarden-pvc
