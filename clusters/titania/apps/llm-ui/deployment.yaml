apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-ui
  labels:
    app.kubernetes.io/name: llm-ui
    app.kubernetes.io/instance: llm-ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-ui
      app.kubernetes.io/instance: llm-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-ui
        app.kubernetes.io/instance: llm-ui
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: llm-ui
          image: ghcr.io/kmjayadeep/vllm-lab-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
