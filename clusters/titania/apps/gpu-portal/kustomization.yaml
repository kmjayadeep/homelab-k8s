apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace transformer: rbac.yaml grants access inside llm-serving and comfyui.
resources:
  - external-secret.yaml
  - rbac.yaml
  - portal.yaml
  - gpu-stats.yaml

configMapGenerator:
  - name: gpu-portal-app
    namespace: gpu-portal
    files:
      - portal/app.py
      - portal/index.html
      - portal/configs.json
      - portal/gpu_stats.py
    options:
      labels:
        app.kubernetes.io/name: gpu-portal
        app.kubernetes.io/instance: gpu-portal
