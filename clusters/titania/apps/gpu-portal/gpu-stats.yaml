apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-stats
  namespace: gpu-portal
  labels:
    app.kubernetes.io/name: gpu-stats
    app.kubernetes.io/instance: gpu-portal
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-stats
      app.kubernetes.io/instance: gpu-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-stats
        app.kubernetes.io/instance: gpu-portal
    spec:
      # hostPID and SYS_PTRACE are needed to read the xe driver's per-process fdinfo, the only
      # in-cluster VRAM source found (plan 0030). The pod has no API token and no GPU request.
      hostPID: true
      automountServiceAccountToken: false
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gpu-stats
          image: python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          command:
            - python3
            - /app/gpu_stats.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 9400
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - SYS_PTRACE
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: gpu-portal-app
            items:
              - key: gpu_stats.py
                path: gpu_stats.py
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-stats
  namespace: gpu-portal
  labels:
    app.kubernetes.io/name: gpu-stats
    app.kubernetes.io/instance: gpu-portal
spec:
  selector:
    app.kubernetes.io/name: gpu-stats
    app.kubernetes.io/instance: gpu-portal
  ports:
    - name: http
      port: 9400
      targetPort: http
