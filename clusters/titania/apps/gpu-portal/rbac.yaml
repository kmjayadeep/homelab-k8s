apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-portal
  namespace: gpu-portal
  labels:
    app.kubernetes.io/name: gpu-portal
    app.kubernetes.io/instance: gpu-portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-portal
  namespace: llm-serving
  labels:
    app.kubernetes.io/name: gpu-portal
    app.kubernetes.io/instance: gpu-portal
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gpu-active"]
    verbs: ["get", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    resourceNames: ["llm-serving-intel-llama"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["intel-llama-ornith", "intel-llama-swift"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-portal
  namespace: llm-serving
  labels:
    app.kubernetes.io/name: gpu-portal
    app.kubernetes.io/instance: gpu-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpu-portal
subjects:
  - kind: ServiceAccount
    name: gpu-portal
    namespace: gpu-portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-portal
  namespace: comfyui
  labels:
    app.kubernetes.io/name: gpu-portal
    app.kubernetes.io/instance: gpu-portal
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gpu-active"]
    verbs: ["get", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    resourceNames: ["comfyui"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["comfyui"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-portal
  namespace: comfyui
  labels:
    app.kubernetes.io/name: gpu-portal
    app.kubernetes.io/instance: gpu-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpu-portal
subjects:
  - kind: ServiceAccount
    name: gpu-portal
    namespace: gpu-portal
