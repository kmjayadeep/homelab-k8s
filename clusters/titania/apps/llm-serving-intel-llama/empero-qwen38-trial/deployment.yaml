apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-llama-empero-qwen38-trial
  labels:
    app.kubernetes.io/name: intel-llama-empero-qwen38-trial
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-serving
spec:
  # Paused for the Tiel 80K retry; retain both Empero quants and projector for rollback.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-llama-empero-qwen38-trial
      app.kubernetes.io/instance: llm-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-llama-empero-qwen38-trial
        app.kubernetes.io/instance: llm-serving
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-serving
    spec:
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      initContainers:
        - name: model-download
          image: curlimages/curl@sha256:43366cd60f226c7655181a0f7e85c468a41d182fdd2dc2c1c3b872a2b9d05d7a
          command:
            - sh
          args:
            - -ec
            - |
              if test -f /models/model-iq3m.gguf; then
                echo '0ad7b253ecee6de7b38ecaf82ea5553d302c3f924961b7091b7088cc99a30f95  /models/model-iq3m.gguf' | sha256sum -c -
              else
                curl --fail --location --retry 5 --output /models/model-iq3m.gguf.partial \
                  https://huggingface.co/empero-ai/Qwen3.8-35B-A3B-Distill-GGUF/resolve/b1f9d1dcc3de8aa867669b0ab919384aeeb9b8d5/Qwen3.8-35B-A3B-IQ3_M.gguf
                echo '0ad7b253ecee6de7b38ecaf82ea5553d302c3f924961b7091b7088cc99a30f95  /models/model-iq3m.gguf.partial' | sha256sum -c -
                mv /models/model-iq3m.gguf.partial /models/model-iq3m.gguf
              fi
              if test -f /models/mmproj.gguf; then
                echo '4381cb5110074396c2c7b39221fffae0c31886aa95b674de8e103d97edf58b94  /models/mmproj.gguf' | sha256sum -c -
              else
                curl --fail --location --retry 5 --output /models/mmproj.gguf.partial \
                  https://huggingface.co/empero-ai/Qwen3.8-35B-A3B-Distill-GGUF/resolve/b1f9d1dcc3de8aa867669b0ab919384aeeb9b8d5/mmproj-Qwen3.8-35B-A3B-F16.gguf
                echo '4381cb5110074396c2c7b39221fffae0c31886aa95b674de8e103d97edf58b94  /models/mmproj.gguf.partial' | sha256sum -c -
                mv /models/mmproj.gguf.partial /models/mmproj.gguf
              fi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp@sha256:2ce301ccfe0a960c6836c56755cad692a3515f4eca2112191c75520b00f17406
          args:
            - --model
            - /models/model-iq3m.gguf
            - --mmproj
            - /models/mmproj.gguf
            - --alias
            - empero-qwen3.8-35b-a3b-iq3m-intel
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --metrics
            - --jinja
            # Native 256K, one slot; active depth and vision memory fit are unverified.
            - --ctx-size
            - "262144"
            - --parallel
            - "1"
            - --cont-batching
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --flash-attn
            - "on"
            - --n-gpu-layers
            - "99"
            # Logical batch for prefill; leave physical microbatch at runtime default.
            - --batch-size
            - "2048"
            - --temp
            - "0.6"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0"
            - --presence-penalty
            - "0"
            - --repeat-penalty
            - "1.0"
            # GGUF metadata and tensors confirm one embedded NextN/MTP layer.
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "3"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 4
              memory: 8Gi
              gpu.intel.com/xe: 1
            limits:
              cpu: 6
              memory: 16Gi
              gpu.intel.com/xe: 1
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: intel-llama-empero-qwen38-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
