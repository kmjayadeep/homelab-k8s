apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: intel-llama-empero-qwen38-model-cache
  labels:
    app.kubernetes.io/name: intel-llama-empero-qwen38-trial
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: model-cache
    app.kubernetes.io/part-of: llm-serving
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Separate 19.63 GB model plus 0.90 GB projector; preserve Swift rollback cache.
      storage: 40Gi
  storageClassName: local-path
