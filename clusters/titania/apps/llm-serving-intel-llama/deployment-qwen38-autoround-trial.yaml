apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-llama-qwen38-autoround-trial
  labels:
    app.kubernetes.io/name: intel-llama-qwen38-autoround-trial
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-serving
spec:
  # Retained Intel AutoRound cache; stop before the Tiel trial claims the B60.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-llama-qwen38-autoround-trial
      app.kubernetes.io/instance: llm-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-llama-qwen38-autoround-trial
        app.kubernetes.io/instance: llm-serving
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-serving
    spec:
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      initContainers:
        - name: model-download
          image: curlimages/curl@sha256:43366cd60f226c7655181a0f7e85c468a41d182fdd2dc2c1c3b872a2b9d05d7a
          command:
            - sh
          args:
            - -ec
            - |
              if test -f /models/model.gguf; then
                echo '766892f84f85c3d1b90704424f90a33344983fa2959860496940bbd41041aad9  /models/model.gguf' | sha256sum -c -
              else
                curl --fail --location --retry 5 --output /models/model.gguf.partial \
                  https://huggingface.co/Intel/Qwen3.8-27B-q4km-AutoRound/resolve/4b30b30e0ac2cc54a2f50738cfccd6c608f94ad4/Qwen3.8-27B-Q4_K_M.gguf
                echo '766892f84f85c3d1b90704424f90a33344983fa2959860496940bbd41041aad9  /models/model.gguf.partial' | sha256sum -c -
                mv /models/model.gguf.partial /models/model.gguf
              fi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp@sha256:2ce301ccfe0a960c6836c56755cad692a3515f4eca2112191c75520b00f17406
          args:
            - --model
            - /models/model.gguf
            - --alias
            - qwen3.8-27b-autoround-intel
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --metrics
            # 80K configured context and Q8 K/V trial; active depth remains unproven.
            # Keep MTP disabled and one slot; monitor VRAM and host pressure.
            - --ctx-size
            - "81920"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --flash-attn
            - "on"
            - --parallel
            - "1"
            - --n-gpu-layers
            - "99"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 4
              memory: 8Gi
              gpu.intel.com/xe: 1
            limits:
              cpu: 6
              memory: 16Gi
              gpu.intel.com/xe: 1
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: intel-llama-qwen38-autoround-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
