apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intel-llama
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  labels:
    app.kubernetes.io/name: intel-llama
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: llm-serving
spec:
  tls:
    - hosts:
        - intel-llama.cosmos.cboxlab.com
      secretName: cosmos-cboxlab-cert
  rules:
    - host: intel-llama.cosmos.cboxlab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intel-llama
                port:
                  name: http
