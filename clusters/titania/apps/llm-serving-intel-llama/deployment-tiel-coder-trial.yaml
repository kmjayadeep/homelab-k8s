apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-llama-tiel-coder-trial
  labels:
    app.kubernetes.io/name: intel-llama-tiel-coder-trial
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-serving
spec:
  # Ornith-1.5 35B-A3B 21G-ICE (plan 0015), 128K, BF16 projector on GPU, ngram-mod speculation.
  # Names keep "tiel-coder" for routing stability; Tiel-Coder was a requant of the same weights.
  # Restored after plan 0018 (Swift Qwen3.8-27B, both phases) missed its quality and 100K decode gates (2026-10-24).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-llama-tiel-coder-trial
      app.kubernetes.io/instance: llm-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-llama-tiel-coder-trial
        app.kubernetes.io/instance: llm-serving
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-serving
    spec:
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      initContainers:
        - name: model-download
          image: curlimages/curl@sha256:ed154ad601683a2a85f8634398a6fbefd64d624df7b8432bbad512f8b8bfbf93
          command:
            - sh
          args:
            - -ec
            - |
              if test -f /models/mmproj-bf16.gguf; then
                echo 'd9ce31026d1cb1f3f8d5152e2e2a014d9d2b302b6c93a7dc07bb0a0487f52837  /models/mmproj-bf16.gguf' | sha256sum -c -
              else
                curl --fail --location --retry 5 --output /models/mmproj-bf16.gguf.partial \
                  https://huggingface.co/peculiar-ragdoll/Tiel-Coder-35B-A3B-GGUF-MTP/resolve/bbe9e566f39e4fc9652ac66b71968289a03c520a/mmproj-BF16.gguf
                echo 'd9ce31026d1cb1f3f8d5152e2e2a014d9d2b302b6c93a7dc07bb0a0487f52837  /models/mmproj-bf16.gguf.partial' | sha256sum -c -
                mv /models/mmproj-bf16.gguf.partial /models/mmproj-bf16.gguf
              fi
              # Ornith-1.5 21G-ICE (plan 0015). The BF16 projector above is the same Ornith projector, from Tiel's repo.
              if test -f /models/model-21g-ice.gguf; then
                echo '42fb3674d92d4ae90928dac0b3a22190702874ec71d7f94c176eb68ca4ca3881  /models/model-21g-ice.gguf' | sha256sum -c -
              else
                curl --fail --location --retry 5 --output /models/model-21g-ice.gguf.partial \
                  https://huggingface.co/gbuzhf/Ornith-1.5-35B-A3B-TIEL-Calibrated-MTPv2-ICE-GGUF/resolve/9991338360005ec7785aefe8c26e9847ced3f1cf/Ornith-1.5-35B-A3B-TIEL_Calibrated-MTPv2-21G-ICE.gguf
                echo '42fb3674d92d4ae90928dac0b3a22190702874ec71d7f94c176eb68ca4ca3881  /models/model-21g-ice.gguf.partial' | sha256sum -c -
                mv /models/model-21g-ice.gguf.partial /models/model-21g-ice.gguf
              fi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llama-server
          # Official server-intel b11515, oneAPI 2026.1.1 / FP16; pin the published image index.
          image: ghcr.io/ggml-org/llama.cpp@sha256:86b37d266ce85b485127adea68c9dc6d04d0ec9a64b0979844d5bbd8d66c53c5
          args:
            - --model
            - /models/model-21g-ice.gguf
            - --mmproj
            - /models/mmproj-bf16.gguf
            - --alias
            - tiel-coder-35b-a3b-intel
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --metrics
            - --jinja
            # 128K with vision is a target, not validated active-context capacity.
            - --ctx-size
            - "131072"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --flash-attn
            - "on"
            - --parallel
            - "1"
            - --n-gpu-layers
            - "99"
            # Cap the host-RAM prompt cache (default 8192 MiB) so anonymous memory stays well inside
            # the 16Gi limit; measured 4.5 GiB anon at idle, 9.7 GiB working set at a 111K prompt.
            - --cache-ram
            - "4096"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "2048"
            - --reasoning-budget
            - "2048"
            # batch 4096 / ubatch 2048 (oct15b) and reasoning budget 2048 (oct14), plan 0014; preserve sampling.
            - --temp
            - "0.6"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0"
            - --presence-penalty
            - "0"
            - --repeat-penalty
            - "1.0"
            # n-gram speculation (no VRAM): +5% decode, -9% eval time in oct15c; MTP stays off.
            - --spec-type
            - ngram-mod
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 4
              memory: 8Gi
              gpu.intel.com/xe: 1
            limits:
              cpu: 6
              memory: 16Gi
              gpu.intel.com/xe: 1
          # The GPU device plugin injects the allocated DRM nodes; no privileged access needed.
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: intel-llama-tiel-coder-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
