apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: intel-llama-tiel-coder-model-cache
  labels:
    app.kubernetes.io/name: intel-llama-tiel-coder-trial
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: model-cache
    app.kubernetes.io/part-of: llm-serving
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 18.12 GB weights + 0.90 GB projector; allow checksum-verified partial downloads.
      storage: 40Gi
  storageClassName: local-path
