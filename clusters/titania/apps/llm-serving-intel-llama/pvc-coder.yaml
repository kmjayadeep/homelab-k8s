apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: intel-llama-coder-model-cache
  labels:
    app.kubernetes.io/name: intel-llama
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: model-cache
    app.kubernetes.io/part-of: llm-serving
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Q4_K_M is 18.6 GB; the verified partial download briefly requires 2x.
      storage: 40Gi
  storageClassName: local-path
