apiVersion: batch/v1
kind: Job
metadata:
  name: intel-llama-swift-qwen38-download-q40
  labels:
    app.kubernetes.io/name: intel-llama-swift-qwen38-trial
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: model-download
    app.kubernetes.io/part-of: llm-serving
spec:
  # Plan 0018 phase 2: add the Q4_0 file (SYCL reorder fast path) to the Swift PVC while Ornith keeps
  # serving. Q4_K_S and the projector stay on the PVC (33.5 GB of 40Gi after this). Remove in the handover PR.
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-llama-swift-qwen38-trial
        app.kubernetes.io/instance: llm-serving
        app.kubernetes.io/component: model-download
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: model-download
          image: curlimages/curl@sha256:ed154ad601683a2a85f8634398a6fbefd64d624df7b8432bbad512f8b8bfbf93
          command:
            - sh
          args:
            - -ec
            - |
              # Swift Qwen3.8-27B Q4_0, same revision as the Q4_K_S file; hash is the HF LFS object hash.
              if test -f /models/model-q40.gguf; then
                echo '2f6c6709ff863e942e9796827f44fe75e0c8431a7b7e09859930762dde9da8e2  /models/model-q40.gguf' | sha256sum -c -
              else
                curl --fail --location --retry 5 --output /models/model-q40.gguf.partial \
                  https://huggingface.co/ukisai/Swift-Qwen3.8-27B-GGUF/resolve/98a6100719e3aafa186041089b71c7b48390dbe1/Swift-Qwen3.8-27B-Q4_0.gguf
                echo '2f6c6709ff863e942e9796827f44fe75e0c8431a7b7e09859930762dde9da8e2  /models/model-q40.gguf.partial' | sha256sum -c -
                mv /models/model-q40.gguf.partial /models/model-q40.gguf
              fi
              ls -l /models
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: intel-llama-swift-qwen38-model-cache
