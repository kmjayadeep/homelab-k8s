apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: intel-llama-swift-qwen38-q3-model-cache
  labels:
    app.kubernetes.io/name: intel-llama-swift-qwen38-trial
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: model-cache
    app.kubernetes.io/part-of: llm-serving
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Plan 0018 phase 3: 13.6 GB Q3_K_M + 0.9 GB projector. Separate from the 40Gi Swift PVC, which
      # already holds Q4_K_S and Q4_0 (33.5 GB) and whose files may only be deleted with approval.
      storage: 20Gi
  storageClassName: local-path
