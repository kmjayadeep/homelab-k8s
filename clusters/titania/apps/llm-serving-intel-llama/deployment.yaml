apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-llama
  labels:
    app.kubernetes.io/name: intel-llama
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-serving
spec:
  # The B60 is exclusively assigned to the measured Qwen3-Coder MoE model.
  # Restore the public coder endpoint after the isolated Qwen3.6 MTP trial.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-llama
      app.kubernetes.io/instance: llm-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-llama
        app.kubernetes.io/instance: llm-serving
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-serving
    spec:
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      initContainers:
        - name: model-download
          image: curlimages/curl@sha256:43366cd60f226c7655181a0f7e85c468a41d182fdd2dc2c1c3b872a2b9d05d7a
          args:
            - -ec
            - |
              test -f /models/model.gguf || {
                curl --fail --location --retry 5 --output /models/model.gguf.partial \
                  https://huggingface.co/mradermacher/Qwen3-Coder-30B-A3B-Instruct-GGUF/resolve/e8ae3e1c21d36f9c57cee690115c06934aca03d9/Qwen3-Coder-30B-A3B-Instruct.Q4_K_M.gguf
                echo '050b8e7977edd2644093b691c899beb156deffdfe20cc33df7fa9ece3aaba257  /models/model.gguf.partial' | sha256sum -c -
                mv /models/model.gguf.partial /models/model.gguf
              }
          command:
            - sh
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp@sha256:2ce301ccfe0a960c6836c56755cad692a3515f4eca2112191c75520b00f17406
          args:
            - --model
            - /models/model.gguf
            - --alias
            - qwen3-coder-30b-a3b-intel
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --metrics
            # Controlled 96K trial; 128K Q8 previously caused host-wide OOM.
            - --ctx-size
            - "98304"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --flash-attn
            - on
            - --parallel
            - "1"
            - --n-gpu-layers
            - "99"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 4
              memory: 8Gi
              gpu.intel.com/xe: 1
            limits:
              cpu: 6
              memory: 16Gi
              gpu.intel.com/xe: 1
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: intel-llama-coder-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
