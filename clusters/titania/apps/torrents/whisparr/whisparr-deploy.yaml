apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisparr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: whisparr
  template:
    metadata:
      labels:
        app: whisparr
    spec:
      volumes:
        - name: whisparr-config
          persistentVolumeClaim:
            claimName: whisparr-config
        - name: nfs-downloads
          persistentVolumeClaim:
            claimName: whisparr-downloads-nfs
      containers:
      - name: whisparr
        image: ghcr.io/hotio/whisparr:v3-a005da5
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "3000"
        volumeMounts:
        - name: whisparr-config
          mountPath: /config
        - mountPath: /data
          name: nfs-downloads
        ports:
        - containerPort: 6969
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "25m"
          limits:
            memory: "500Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
