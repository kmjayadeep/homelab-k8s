apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      volumes:
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: nfs-downloads
          persistentVolumeClaim:
            claimName: sonarr-downloads-nfs
      containers:
        - name: sonarr
          image: ghcr.io/hotio/sonarr:nightly-5.0.0.2635 # {"$imagepolicy": "torrents:sonarr"}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "3000"
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - mountPath: /data
              name: nfs-downloads
          ports:
            - containerPort: 8989
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "500Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
