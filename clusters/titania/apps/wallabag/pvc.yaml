apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallabag-data
  labels:
    app.kubernetes.io/name: wallabag
    app.kubernetes.io/instance: wallabag
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallabag-images
  labels:
    app.kubernetes.io/name: wallabag
    app.kubernetes.io/instance: wallabag
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
