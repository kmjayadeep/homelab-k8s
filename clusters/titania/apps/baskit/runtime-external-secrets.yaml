apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault-runtime
  namespace: baskit
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-runtime
  namespace: baskit
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: baskit-runtime
          serviceAccountRef:
            name: external-secrets-vault-runtime
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret-vault
  namespace: baskit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-runtime
  target:
    name: ghcr-secret-vault
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: services/ghcr/baskit-pull
        property: dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: baskit-backup-vault
  namespace: baskit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-runtime
  target:
    name: baskit-backup-vault
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GCP_PROJECT_ID
      remoteRef:
        key: services/object-storage/baskit-backup
        property: project_id
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: services/object-storage/baskit-backup
        property: access_key
    - secretKey: MINIO_BUCKET
      remoteRef:
        key: services/object-storage/baskit-backup
        property: bucket
    - secretKey: MINIO_ENDPOINT
      remoteRef:
        key: services/object-storage/baskit-backup
        property: endpoint
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: services/object-storage/baskit-backup
        property: secret_key
    - secretKey: MINIO_USE_SSL
      remoteRef:
        key: services/object-storage/baskit-backup
        property: use_ssl
