apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: postgres-restore-drill
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: postgres-restore-drill
spec:
  provider:
    vault:
      server: https://vault.vault.svc.cluster.local:8200
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        key: ca.crt
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgres-restore-drill
          serviceAccountRef:
            name: external-secrets-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-restic
  namespace: postgres-restore-drill
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: postgres-restic
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: services/object-storage/postgres-restic
        property: repository
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: services/object-storage/postgres-restic
        property: restic_password
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: services/object-storage/postgres-restic
        property: access_key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: services/object-storage/postgres-restic
        property: secret_key
