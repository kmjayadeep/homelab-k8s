apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
  annotations:
    # Pruning the CRDs would delete every Agent, ModelConfig and RemoteMCPServer at once.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  chart:
    spec:
      chart: kagent-crds
      version: "0.10.4"
      sourceRef:
        kind: HelmRepository
        name: kagent
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    kmcp:
      enabled: true
    substrate:
      enabled: false
