apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smollm2-135m
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    serving.kserve.io/stop: "true"
  labels:
    app.kubernetes.io/name: smollm2-135m
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: predictor
spec:
  predictor:
    deploymentStrategy:
      type: Recreate
    nodeSelector:
      workload: ai
    tolerations:
      - key: workload
        operator: Equal
        value: ai
        effect: NoSchedule
    securityContext:
      runAsNonRoot: true
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    model:
      modelFormat:
        name: huggingface
      runtime: kserve-huggingfaceserver
      storageUri: "hf://HuggingFaceTB/SmolLM2-135M-Instruct:12fd25f77366fa6b3b4b768ec3050bf629380bac"
      args:
        - --backend=huggingface
        - --dtype=float32
        - --max_model_len=512
      resources:
        requests:
          cpu: 1
          memory: 1Gi
        limits:
          cpu: 2
          memory: 3Gi
