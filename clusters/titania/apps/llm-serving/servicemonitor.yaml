apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-serving-vllm
  labels:
    app.kubernetes.io/name: llm-serving
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  endpoints:
    # KServe names this generated Service port after the predictor Service.
    # vLLM runtimes do not declare a containerPort, so targetPort cannot select it.
    - port: smollm2-135m-vllm-predictor
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: job
          replacement: llm-serving-vllm
