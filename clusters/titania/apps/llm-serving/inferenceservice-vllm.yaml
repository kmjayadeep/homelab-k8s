apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smollm2-135m-vllm
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  labels:
    app.kubernetes.io/name: smollm2-135m-vllm
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: predictor
spec:
  predictor:
    deploymentStrategy:
      type: Recreate
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    model:
      modelFormat:
        name: vLLM
      runtime: kserve-vllmserver
      # Decensored SmolLM2-135M-Instruct variant; pin the reviewed revision.
      storageUri: "hf://teja944/SmolLM2-135M-Instruct-heretic:125f7fe8695513a831ad7cc1f285ffd9615a8419"
      args:
        # Halves model-weight memory versus float32; benchmark latency on this CPU.
        - --dtype=bfloat16
        # Keep the 128 MiB KV-cache cap; this allows one ~4K-token sequence.
        - --max-model-len=4096
        # The gateway presents this stable alias to clients and can remap it later
        # without changing their base URL or model selection.
        - --served-model-name=chat-default
        # SmolLM2-135M at bfloat16 needs about 96 MiB of KV tensors for a
        # 4K-token sequence. The fixed cache cap deliberately limits this
        # predictor to roughly one concurrent long-context request.
        - --kv-cache-memory-bytes=134217728
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          cpu: 2
          memory: 3Gi
