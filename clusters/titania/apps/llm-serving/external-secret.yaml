apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault-huggingface
  namespace: llm-serving
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-huggingface
  namespace: llm-serving
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: llm-serving-huggingface
          serviceAccountRef:
            name: external-secrets-vault-huggingface
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: huggingface-token-vault
  namespace: llm-serving
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-huggingface
  target:
    name: huggingface-token-vault
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: services/huggingface/model-serving
        property: token
