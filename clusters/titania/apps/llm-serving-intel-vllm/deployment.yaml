apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-vllm
  labels:
    app.kubernetes.io/name: intel-vllm
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-serving
spec:
  # Trial only: leave stopped until the sole B60 is explicitly released.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-vllm
      app.kubernetes.io/instance: llm-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-vllm
        app.kubernetes.io/instance: llm-serving
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-serving
    spec:
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: vllm
          # Intel llm-scaler-vLLM 0.26.0-b2 (upstream release image digest).
          image: intel/llm-scaler-vllm@sha256:032916bd9264da44cab3e99092ffaf12331072ec51c3b380cbbe5fd98eb0254b
          imagePullPolicy: IfNotPresent
          env:
            - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
              value: "1"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
          args:
            # Third-party AWQ safetensors; do not reuse the GGUF cache.
            # One session, 16K startup gate; expand only after measured capacity.
            - --model=mattbucci/Qwen3.8-27B-AWQ
            - --revision=2cc4cffb391645c9be52f3fe50ff595ac7df3e38
            - --served-model-name=qwen3.8-27b-awq-intel-trial
            - --max-model-len=16384
            - --max-num-seqs=1
            - --max-num-batched-tokens=4096
            - --gpu-memory-utilization=0.80
            - --kv-cache-dtype=fp8_e4m3
            - --enforce-eager
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 4
              memory: 12Gi
              gpu.intel.com/xe: 1
            limits:
              cpu: 6
              memory: 20Gi
              gpu.intel.com/xe: 1
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
            # vLLM's XPU image requires the DRM render nodes and by-path links.
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: intel-vllm-qwen38-awq-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
