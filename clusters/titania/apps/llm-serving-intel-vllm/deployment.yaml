apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-vllm
  labels:
    app.kubernetes.io/name: intel-vllm
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-serving
spec:
  # Kept installed for rollback; llama.cpp owns the sole B60 allocation.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-vllm
      app.kubernetes.io/instance: llm-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-vllm
        app.kubernetes.io/instance: llm-serving
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-serving
    spec:
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: vllm
          # Intel's llm-scaler-vLLM B60 image, pinned to the upstream beta digest.
          image: intel/llm-scaler-vllm@sha256:52218ad85513ab6686d4c090c83c2bd8c5b02423c63aa4dabd41837fe641fe3b
          imagePullPolicy: IfNotPresent
          env:
            - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
              value: "1"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
          args:
            # Qwen2.5-14B-AWQ is a 4-bit model. YaRN extends its shipped 32K
            # configuration to 128K; use one sequence while validating B60 VRAM.
            - --model=Qwen/Qwen2.5-14B-Instruct-AWQ
            - --revision=539535859b135b0244c91f3e59816150c8056698
            - --served-model-name=qwen2.5-14b-awq-intel
            - --max-model-len=131072
            - --max-num-seqs=1
            # Startup measured 12.0 GiB KV need versus 11.37 GiB at 0.90.
            - --gpu-memory-utilization=0.95
            - --kv-cache-dtype=fp8
            - --enforce-eager
            - --disable-sliding-window
            - --hf-overrides={"rope_parameters":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768,"rope_theta":1000000.0}}
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 4
              memory: 8Gi
              gpu.intel.com/xe: 1
            limits:
              cpu: 6
              memory: 16Gi
              gpu.intel.com/xe: 1
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
            # vLLM's XPU image requires the DRM render nodes and by-path links.
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: intel-vllm-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
