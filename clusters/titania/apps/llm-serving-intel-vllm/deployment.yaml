apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel-vllm
  labels:
    app.kubernetes.io/name: intel-vllm
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: llm-serving
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-vllm
      app.kubernetes.io/instance: llm-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-vllm
        app.kubernetes.io/instance: llm-serving
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: llm-serving
    spec:
      nodeSelector:
        gpu.intel.com/product: arc-pro-b60
        workload: ai
      tolerations:
        - key: workload
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai-xpu@sha256:9b6dd7db65a02a3611fd6645b358780c71105f8d037ea4bc73fd00202d370125
          imagePullPolicy: IfNotPresent
          args:
            - --model=Qwen/Qwen3-0.6B
            - --served-model-name=qwen3-0.6b-intel
            - --max-model-len=4096
            - --gpu-memory-utilization=0.75
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 2
              memory: 6Gi
              gpu.intel.com/xe: 1
            limits:
              cpu: 4
              memory: 10Gi
              gpu.intel.com/xe: 1
          securityContext:
            privileged: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: intel-vllm-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
