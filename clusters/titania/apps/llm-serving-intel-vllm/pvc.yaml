apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: intel-vllm-model-cache
  labels:
    app.kubernetes.io/name: intel-vllm
    app.kubernetes.io/instance: llm-serving
    app.kubernetes.io/component: model-cache
    app.kubernetes.io/part-of: llm-serving
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Qwen3-8B safetensors are 15.25 GiB; retain download and compile headroom.
      storage: 30Gi
  # Node-local cache; the predictor is pinned to titania-gpu.
  storageClassName: local-path
