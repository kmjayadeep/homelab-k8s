apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-github
  labels:
    app.kubernetes.io/name: github-mcp
    app.kubernetes.io/instance: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: kagent-github
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # GitHub App installed only on kmjayadeep/homelab-k8s (Contents and Pull requests read/write, Metadata read).
    # The server mints short-lived installation tokens from the private key. Plan 0021.
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: services/github/kagent-gitops
        property: app_id
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: services/github/kagent-gitops
        property: installation_id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: services/github/kagent-gitops
        property: private_key
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: github-mcp
  labels:
    app.kubernetes.io/name: github-mcp
    app.kubernetes.io/instance: kagent
spec:
  # kmcp runs the stdio server behind its HTTP transport proxy.
  transportType: stdio
  deployment:
    # Do not set deployment.labels: kmcp replaces (not merges) the pod template labels and its selector
    # then no longer matches. kmcp labels the pods app.kubernetes.io/managed-by=kmcp itself.
    image: ghcr.io/github/github-mcp-server:v2.0.3
    port: 3000
    cmd: /server/github-mcp-server
    args:
      - stdio
      # issues is needed only for PR conversation comments (add_issue_comment); issue creation stays excluded.
      - --toolsets=repos,pull_requests,issues
      # Pull requests are the only write path: no merging, deleting, forking, reviewing or new repositories.
      - --exclude-tools=merge_pull_request,delete_file,create_repository,fork_repository,pull_request_review_write,add_comment_to_pending_review,add_reply_to_pull_request_comment,update_pull_request_branch,issue_write,sub_issue_write
    secretRefs:
      - name: kagent-github
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kmcp-servers
  labels:
    app.kubernetes.io/name: kmcp-servers
    app.kubernetes.io/instance: kagent
spec:
  # kmcp-managed MCP servers have no caller authentication; github-mcp fronts a write-capable GitHub
  # credential. Only pods in this namespace (controller, agents) may reach any of them.
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kmcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
