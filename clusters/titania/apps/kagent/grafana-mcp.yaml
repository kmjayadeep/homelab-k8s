apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-grafana
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: kagent-grafana
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Viewer-role Grafana service account `kagent-mcp` (plan 0020).
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: services/grafana/kagent
        property: token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
  annotations:
    secret.reloader.stakater.com/reload: kagent-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
      app.kubernetes.io/instance: kagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
        app.kubernetes.io/instance: kagent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana-mcp
          image: docker.io/grafana/mcp-grafana:2.1.1
          # The image entrypoint defaults to SSE; set the command so our flags are the only ones.
          # 2.1.1 rejects requests whose Host header is not in --allowed-hosts (defaults to loopback), so list
          # the Service names agents use and serve /healthz on a side listener for kubelet probes.
          # Only the read tool categories the SRE agent needs are registered, and writes are disabled.
          command:
            - /app/mcp-grafana
          args:
            - --transport=streamable-http
            - --address=0.0.0.0:8000
            - --healthz-address=:8080
            - --allowed-hosts=grafana-mcp.kagent.svc.cluster.local:8000,grafana-mcp.kagent.svc:8000,grafana-mcp.kagent:8000,grafana-mcp:8000
            - --enabled-tools=datasource,prometheus,loki,alerting,dashboard,search
            - --disable-write
          env:
            - name: GRAFANA_URL
              value: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kagent-grafana
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
          ports:
            - name: http
              containerPort: 8000
            - name: healthz
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
spec:
  selector:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
spec:
  description: Grafana MCP server (Prometheus, Loki, dashboards, alert rules) with a Viewer token
  protocol: STREAMABLE_HTTP
  url: http://grafana-mcp.kagent.svc.cluster.local:8000/mcp
  timeout: 60s
  sseReadTimeout: 5m0s
  terminateOnClose: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
spec:
  # The MCP endpoint has no caller authentication; only pods in this namespace (controller, agents) may use it.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
      app.kubernetes.io/instance: kagent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
