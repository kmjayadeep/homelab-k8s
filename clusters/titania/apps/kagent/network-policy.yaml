apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-postgresql
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
spec:
  # The bundled PostgreSQL uses the chart's fixed credentials, so only the controller may reach it.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
              app.kubernetes.io/instance: kagent
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 5432
