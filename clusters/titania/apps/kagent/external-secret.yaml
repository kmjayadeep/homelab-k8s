apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
spec:
  provider:
    vault:
      server: https://vault.vault.svc.cluster.local:8200
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        key: ca.crt
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kagent
          serviceAccountRef:
            name: external-secrets-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-litellm
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: kagent-litellm
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # LiteLLM virtual key dedicated to kagent (alias `kagent`), never the LiteLLM master key.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: apps/litellm/kagent
        property: api_key
