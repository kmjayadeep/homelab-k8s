apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: music-mcp
  labels:
    app.kubernetes.io/name: music-mcp
    app.kubernetes.io/instance: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: music-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Jellyfin API key; music-mcp calls GET endpoints only (plan 0026).
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: services/jellyfin/music-mcp
        property: api_key
    # Last.fm API account key, public read methods only.
    - secretKey: LASTFM_API_KEY
      remoteRef:
        key: services/lastfm/music-mcp
        property: api_key
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-mcp-data
  labels:
    app.kubernetes.io/name: music-mcp
    app.kubernetes.io/instance: kagent
spec:
  # SQLite with digests, suggestions and feedback (the "want" queue). Small, but the only state the
  # music-curator agent has; deleting it resets what was suggested before.
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-mcp
  labels:
    app.kubernetes.io/name: music-mcp
    app.kubernetes.io/instance: kagent
  annotations:
    secret.reloader.stakater.com/reload: music-mcp
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: music-mcp
      app.kubernetes.io/instance: kagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-mcp
        app.kubernetes.io/instance: kagent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: music-mcp
          # Source: kmjayadeep/docker-images music-mcp/.
          image: ghcr.io/kmjayadeep/music-mcp:20261107173625
          env:
            - name: JELLYFIN_URL
              value: https://jellyfin.cosmos.cboxlab.com
            # Jellyfin user whose favourites count; empty disables the favourites tool.
            - name: JELLYFIN_USER
              value: jd
            - name: YTM_LOCATION
              value: IN
            - name: DB_PATH
              value: /data/music.db
            - name: ALLOWED_HOSTS
              value: music-mcp.kagent.svc.cluster.local,music-mcp.kagent.svc,music-mcp.kagent,music-mcp
            # ytmusicapi writes nothing, but Python wants a writable HOME and tmp with a read-only root.
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: music-mcp
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-mcp-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: music-mcp
  labels:
    app.kubernetes.io/name: music-mcp
    app.kubernetes.io/instance: kagent
spec:
  selector:
    app.kubernetes.io/name: music-mcp
    app.kubernetes.io/instance: kagent
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: music-mcp
  labels:
    app.kubernetes.io/name: music-mcp
    app.kubernetes.io/instance: kagent
spec:
  description: Music library (Jellyfin), discovery (YouTube Music, Last.fm) and digest/feedback store for music-curator
  protocol: STREAMABLE_HTTP
  url: http://music-mcp.kagent.svc.cluster.local:8000/mcp
  # Discovery tools fan out to YouTube Music; the first library load reads every track from Jellyfin.
  timeout: 120s
  sseReadTimeout: 5m0s
  terminateOnClose: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: music-mcp
  labels:
    app.kubernetes.io/name: music-mcp
    app.kubernetes.io/instance: kagent
spec:
  # Neither /mcp nor the bot routes (/digest, /feedback, /wants) authenticate callers; only pods in this
  # namespace (controller, agents, Telegram bot) may reach them.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: music-mcp
      app.kubernetes.io/instance: kagent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
