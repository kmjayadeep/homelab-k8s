apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
  annotations:
    # The UI streams agent output over SSE; match the chart's own nginx timeouts (1800s).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kagent.cosmos.cboxlab.com
      secretName: cosmos-cboxlab-cert
  rules:
    - host: kagent.cosmos.cboxlab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kagent-ui
                port:
                  number: 8080
