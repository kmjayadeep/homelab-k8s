apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kagent
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
  annotations:
    # The UI streams agent output over SSE; match the chart's own nginx timeouts (1800s).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # HTTP basic auth for the whole host (UI and its /api proxy, including A2A through the Ingress).
    # Credentials: Vault apps/kagent/ui-basic-auth, rendered by the kagent-ui-basic-auth ExternalSecret.
    # In-cluster callers (Telegram bot, agents) use the controller Service directly and are unaffected.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: kagent-ui-basic-auth
    nginx.ingress.kubernetes.io/auth-secret-type: auth-file
    nginx.ingress.kubernetes.io/auth-realm: kagent
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kagent.cosmos.cboxlab.com
      secretName: cosmos-cboxlab-cert
  rules:
    - host: kagent.cosmos.cboxlab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kagent-ui
                port:
                  number: 8080
