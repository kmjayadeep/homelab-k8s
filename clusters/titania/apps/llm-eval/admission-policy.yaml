# RBAC cannot restrict what a created Job contains. llm-serving holds the
# wildcard TLS Secret, so runner-created Jobs may only be eval servers: pinned
# llama.cpp image, model cache + emptyDir volumes, no Secrets or API token.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: llm-eval-server-jobs
  labels:
    app.kubernetes.io/name: llm-eval-server-jobs
    app.kubernetes.io/instance: llm-eval
    app.kubernetes.io/part-of: llm-eval
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - jobs
  matchConditions:
    - name: llm-eval-runner-only
      expression: request.userInfo.username == 'system:serviceaccount:actions-runner-system:llm-eval-runner'
  variables:
    - name: pod
      expression: object.spec.template.spec
    - name: containers
      expression: >-
        variables.pod.containers +
        (has(variables.pod.initContainers) ? variables.pod.initContainers : [])
  validations:
    - expression: object.metadata.name.startsWith('llm-eval-server-')
      message: Job name must start with llm-eval-server-
    - expression: >-
        has(object.spec.template.metadata.labels) &&
        object.spec.template.metadata.labels['app.kubernetes.io/name'] == 'llm-eval-server'
      message: Pod template must carry app.kubernetes.io/name=llm-eval-server
    - expression: >-
        has(variables.pod.automountServiceAccountToken) &&
        variables.pod.automountServiceAccountToken == false &&
        (!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName == 'default')
      message: Eval servers must not mount a ServiceAccount token
    - expression: >-
        variables.containers.all(c, c.image.startsWith('ghcr.io/ggml-org/llama.cpp@sha256:'))
      message: Only digest-pinned ghcr.io/ggml-org/llama.cpp images are allowed
    - expression: >-
        !has(variables.pod.volumes) || variables.pod.volumes.all(v,
          has(v.emptyDir) ||
          (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'intel-llama-tiel-coder-model-cache'))
      message: Only the model-cache PVC and emptyDir volumes are allowed
    - expression: >-
        variables.containers.all(c,
          !has(c.envFrom) &&
          (!has(c.env) || c.env.all(e, !has(e.valueFrom))))
      message: Environment must not reference Secrets, ConfigMaps or fields
    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) ||
          ((!has(c.securityContext.privileged) || c.securityContext.privileged == false) &&
           (!has(c.securityContext.allowPrivilegeEscalation) || c.securityContext.allowPrivilegeEscalation == false)))
      message: Privileged containers are not allowed
    - expression: >-
        (!has(variables.pod.hostNetwork) || variables.pod.hostNetwork == false) &&
        (!has(variables.pod.hostPID) || variables.pod.hostPID == false) &&
        (!has(variables.pod.hostIPC) || variables.pod.hostIPC == false)
      message: Host namespaces are not allowed
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: llm-eval-server-jobs
  labels:
    app.kubernetes.io/name: llm-eval-server-jobs
    app.kubernetes.io/instance: llm-eval
    app.kubernetes.io/part-of: llm-eval
spec:
  policyName: llm-eval-server-jobs
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: llm-serving
