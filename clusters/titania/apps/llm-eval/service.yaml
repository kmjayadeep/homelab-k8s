# Stable in-cluster endpoint for whichever eval-server Job is running. Labels
# deliberately differ from production so intel-llama-metrics never selects it.
apiVersion: v1
kind: Service
metadata:
  name: llm-eval
  namespace: llm-serving
  labels:
    app.kubernetes.io/name: llm-eval
    app.kubernetes.io/instance: llm-eval
    app.kubernetes.io/part-of: llm-eval
spec:
  selector:
    app.kubernetes.io/name: llm-eval-server
  ports:
    - name: http
      port: 8080
      targetPort: http
