apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-eval
  namespace: llm-serving
  labels:
    app.kubernetes.io/name: llm-eval
    app.kubernetes.io/instance: llm-eval
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: llm-eval
spec:
  groups:
    - name: llm-eval
      rules:
        # The nightly window is two hours; anything longer means restore failed.
        - alert: LlmEvalProductionNotRestored
          expr: kube_deployment_status_replicas_available{namespace="llm-serving", deployment="intel-llama-tiel-coder-trial"} < 1
          for: 2h15m
          labels:
            severity: critical
          annotations:
            summary: "B60 production model has been unavailable longer than the eval window"
            description: "Check the llm-eval-watchdog CronJob and whether llm-serving-intel-llama is still suspended."
        - alert: LlmEvalServerLingering
          expr: max(kube_job_status_active{namespace="llm-serving", job_name=~"llm-eval-server-.*"}) > 0
          for: 2h15m
          labels:
            severity: warning
          annotations:
            summary: "An llm-eval-server Job is still holding the B60 after the eval window"
