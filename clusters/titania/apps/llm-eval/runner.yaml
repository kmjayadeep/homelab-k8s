apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-eval-runner
  namespace: actions-runner-system
  labels:
    app.kubernetes.io/name: llm-eval-runner
    app.kubernetes.io/instance: llm-eval
    app.kubernetes.io/part-of: llm-eval
---
# Private repository only: self-hosted runners on the public homelab repositories
# could execute fork-PR code with this ServiceAccount.
apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: homelab-llm-evals
  namespace: actions-runner-system
  labels:
    app.kubernetes.io/name: llm-eval-runner
    app.kubernetes.io/instance: llm-eval
    app.kubernetes.io/part-of: llm-eval
spec:
  replicas: 1
  template:
    spec:
      repository: kmjayadeep/homelab-llm-evals
      labels:
        - cosmos
        - llm-eval
      image: ghcr.io/kmjayadeep/actions-runner:latest
      serviceAccountName: llm-eval-runner
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 2Gi
      # Hosts the network-less grading container for model-generated code.
      dockerdContainerResources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 2Gi
