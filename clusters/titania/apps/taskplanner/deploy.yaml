apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskplanner
  annotations:
    secret.reloader.stakater.com/reload: taskplanner-config-vault
  labels:
    app: taskplanner
    app.kubernetes.io/name: taskplanner
    app.kubernetes.io/instance: taskplanner
spec:
  selector:
    matchLabels:
      app: taskplanner
  template:
    metadata:
      labels:
        app: taskplanner
        app.kubernetes.io/name: taskplanner
        app.kubernetes.io/instance: taskplanner
    spec:
      containers:
        - name: taskplanner
          image: ghcr.io/kmjayadeep/taskplanner-server:20250305072427 # {"$imagepolicy": "taskplanner:taskplanner"}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskplanner-config-vault
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://taskplanner:$(POSTGRES_PASSWORD)@postgres.cosmos.cboxlab.com:5432/taskplanner"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              memory: "50Mi"
              cpu: "25m"
            limits:
              memory: "100Mi"
              cpu: "250m"
