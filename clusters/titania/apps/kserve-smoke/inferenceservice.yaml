apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smollm2-135m
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  labels:
    app.kubernetes.io/name: smollm2-135m
    app.kubernetes.io/instance: kserve-smoke
    app.kubernetes.io/component: predictor
spec:
  predictor:
    minReplicas: 1
    model:
      modelFormat:
        name: huggingface
      runtime: kserve-huggingfaceserver
      args:
        - --model_name=smollm2
        - --model_id=HuggingFaceTB/SmolLM2-135M-Instruct
        - --backend=huggingface
        - --dtype=bfloat16
        - --max_model_len=512
      resources:
        requests:
          cpu: 1
          memory: 1Gi
        limits:
          cpu: 2
          memory: 3Gi
