apiVersion: v1
kind: Service
metadata:
  name: wolf
  labels:
    app.kubernetes.io/name: wolf
    app.kubernetes.io/instance: wolf
    app.kubernetes.io/component: game-streaming
    app.kubernetes.io/part-of: wolf
  annotations:
    # A fixed address from main-pool (192.168.1.180-199): Moonlight pairs with an IP, and Wolf
    # advertises the same one through WOLF_INTERNAL_IP in deployment.yaml.
    metallb.io/loadBalancerIPs: 192.168.1.184
spec:
  # The GameStream protocol is raw TCP and UDP, so it cannot go through the Ingress.
  type: LoadBalancer
  # Keep the client address and skip the extra hop; the pod only ever runs on titania-gpu.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: wolf
    app.kubernetes.io/instance: wolf
  ports:
    - name: https
      port: 47984
      targetPort: https
      protocol: TCP
    - name: http
      port: 47989
      targetPort: http
      protocol: TCP
    - name: rtsp
      port: 48010
      targetPort: rtsp
      protocol: TCP
    - name: control
      port: 47999
      targetPort: control
      protocol: UDP
    - name: video
      port: 48100
      targetPort: video
      protocol: UDP
    - name: audio
      port: 48200
      targetPort: audio
      protocol: UDP
