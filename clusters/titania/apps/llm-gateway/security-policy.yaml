apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: llm-gateway-api-key
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/instance: llm-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-gateway
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: llm-gateway-api-keys
    extractFrom:
      - headers:
          - authorization
