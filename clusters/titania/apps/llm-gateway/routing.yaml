apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: chat-default
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/instance: llm-gateway
spec:
  endpoints:
    - fqdn:
        hostname: smollm2-135m-vllm-predictor.llm-serving.svc.cluster.local
        port: 80
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: chat-default
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/instance: llm-gateway
spec:
  schema:
    name: OpenAI
    version: v1
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: chat-default
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: chat-smollm2-code
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/instance: llm-gateway
spec:
  # Temporary shared backend. Replace this endpoint with the Code predictor
  # Service when InferenceService/smollm2-135m-code-vllm is deployed.
  endpoints:
    - fqdn:
        hostname: smollm2-135m-vllm-predictor.llm-serving.svc.cluster.local
        port: 80
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: chat-smollm2-code
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/instance: llm-gateway
spec:
  schema:
    name: OpenAI
    version: v1
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: chat-smollm2-code
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/instance: llm-gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm-gateway
  hostnames:
    - llm-gateway.cosmos.cboxlab.com
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: chat-default
      modelsOwnedBy: homelab
      backendRefs:
        - name: chat-default
      timeouts:
        request: 10m
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: chat-smollm2-code
      modelsOwnedBy: homelab
      backendRefs:
        - name: chat-smollm2-code
          # The shared vLLM instance currently serves chat-default. Remove this
          # override after the Code deployment serves chat-smollm2-code.
          modelNameOverride: chat-default
      timeouts:
        request: 10m
