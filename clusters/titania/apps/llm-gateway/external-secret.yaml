apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/instance: llm-gateway
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      # Vault internal TLS is tracked separately; this matches existing stores.
      server: http://vault.vault.svc.cluster.local:8200
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: llm-gateway
          serviceAccountRef:
            name: external-secrets-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-gateway-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: llm-gateway-api-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: default
      remoteRef:
        key: apps/llm-gateway/core
        property: api_key
