apiVersion: v1
kind: Service
metadata:
  name: finance-mcp
  namespace: beancount
  labels:
    app.kubernetes.io/name: finance-mcp
    app.kubernetes.io/instance: fava
spec:
  selector:
    app: fava
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fava
  namespace: beancount
  labels:
    app.kubernetes.io/name: fava
    app.kubernetes.io/instance: fava
spec:
  # finance-mcp does not authenticate callers and returns personal financial data, so only the agent that uses
  # it and the kagent controller (tool discovery) may reach it. Fava's own port stays open as before; its Ingress
  # requires basic auth.
  podSelector:
    matchLabels:
      app: fava
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
          podSelector:
            matchLabels:
              kagent: finance-curator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8000
