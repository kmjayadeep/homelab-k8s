apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: bookorbit
          serviceAccountRef:
            name: external-secrets-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-config-vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: bookorbit-config-vault
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: services/postgresql/bookorbit
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: apps/bookorbit/core
        property: jwt_secret
    - secretKey: SETUP_BOOTSTRAP_TOKEN
      remoteRef:
        key: apps/bookorbit/core
        property: setup_bootstrap_token
