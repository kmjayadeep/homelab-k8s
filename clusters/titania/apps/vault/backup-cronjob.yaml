apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-backup
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-backup
    app.kubernetes.io/instance: vault
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-backup
    app.kubernetes.io/instance: vault
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-backup
            app.kubernetes.io/instance: vault
        spec:
          serviceAccountName: vault-backup
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: raft-snapshot
              image: hashicorp/vault:1.18.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  umask 077
                  VAULT_TOKEN="$(vault login \
                    -method=kubernetes \
                    -token-only \
                    role=vault-raft-snapshot \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)"
                  export VAULT_TOKEN
                  vault operator raft snapshot save /snapshot/vault.snap
                  sha256sum /snapshot/vault.snap > /snapshot/vault.snap.sha256
              env:
                - name: VAULT_ADDR
                  value: http://vault-active.vault.svc.cluster.local:8200
                - name: VAULT_CLIENT_TIMEOUT
                  value: 10m
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 100
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
          containers:
            - name: upload
              image: amazon/aws-cli:2.24.18
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  timestamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"

                  upload_snapshot() {
                    tier="$1"
                    prefix="s3://${AWS_BUCKET}/titania/${tier}"
                    aws --endpoint-url "$AWS_ENDPOINT_URL" s3 cp \
                      /snapshot/vault.snap "${prefix}/vault-${timestamp}.snap"
                    aws --endpoint-url "$AWS_ENDPOINT_URL" s3 cp \
                      /snapshot/vault.snap.sha256 "${prefix}/vault-${timestamp}.snap.sha256"
                  }

                  upload_snapshot daily
                  if [ "$(date -u +%u)" = "7" ]; then
                    upload_snapshot weekly
                  fi
                  if [ "$(date -u +%d)" = "01" ]; then
                    upload_snapshot monthly
                  fi
              envFrom:
                - secretRef:
                    name: vault-backup-s3
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
          volumes:
            - name: snapshot
              emptyDir:
                sizeLimit: 2Gi
