apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
  annotations:
    # Stateful: never let Flux garbage-collect this, even if the manifest is
    # renamed or removed. Deleting it must be a deliberate manual action.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: vault
      version: "0.30.1"
      sourceRef:
        kind: HelmRepository
        name: vault
        namespace: vault
  interval: 1h0m0s
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    global:
      # Serve the API over TLS; the chart switches VAULT_ADDR, probes, Service
      # port names, and the ServiceMonitor scheme to HTTPS.
      tlsDisable: false
    ui:
      enabled: true
    serverTelemetry:
      serviceMonitor:
        enabled: true
      prometheusRules:
        enabled: true
        rules:
          - alert: VaultDown
            expr: up{job="vault-active"} == 0
            for: 5m
            annotations:
              summary: "Vault server is down or unreachable"
              description: "Vault server has been down for more than 5 minutes."
            
          - alert: VaultUnsealed
            expr: vault_core_unsealed == 0
            for: 5m
            annotations:
              summary: "Vault is sealed"
              description: "Vault is sealed and unable to serve requests."

    server:
      # Mounted by the chart at /vault/userconfig/vault-tls-cert.
      extraVolumes:
        - type: secret
          name: vault-tls-cert
      extraEnvironmentVars:
        VAULT_CACERT: /vault/userconfig/vault-tls-cert/ca.crt
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: vault
                  app.kubernetes.io/name: vault
                  component: server
              topologyKey: kubernetes.io/hostname
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          config: |
            ui = true
            cluster_name = "vault-integrated-storage"
            listener "tcp" {
              address = "0.0.0.0:8200"
              cluster_address = "0.0.0.0:8201"
              tls_disable = 0
              tls_cert_file = "/vault/userconfig/vault-tls-cert/tls.crt"
              tls_key_file = "/vault/userconfig/vault-tls-cert/tls.key"
              tls_min_version = "tls12"
              telemetry {
                unauthenticated_metrics_access = "true"
              }
            }

            # Update active vault pods with `vault-active=true` label
            service_registration "kubernetes" {}

            storage "raft" {
              path = "/vault/data"
              retry_join {
                leader_api_addr = "https://vault-0.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-tls-cert/ca.crt"
              }
              retry_join {
                leader_api_addr = "https://vault-1.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-tls-cert/ca.crt"
              }
              retry_join {
                leader_api_addr = "https://vault-2.vault-internal:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-tls-cert/ca.crt"
              }
            }

            telemetry {
              disable_hostname = true
              prometheus_retention_time = "12h"
            }
      ingress:
        enabled: true
        annotations:
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
        hosts:
        - host: vault.cosmos.cboxlab.com
        tls:
        - secretName: cosmos-cboxlab-cert
          hosts:
            - "*.cosmos.cboxlab.com"
      dataStorage:
        storageClass: longhorn-static
