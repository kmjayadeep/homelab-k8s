apiVersion: apps/v1
kind: Deployment
metadata:
  name: portkey
  labels:
    app.kubernetes.io/name: portkey
    app.kubernetes.io/instance: portkey
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portkey
      app.kubernetes.io/instance: portkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portkey
        app.kubernetes.io/instance: portkey
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: portkeyai/gateway:1.15.2
          imagePullPolicy: IfNotPresent
          env:
            - name: TRUSTED_CUSTOM_HOSTS
              value: smollm2-135m-vllm-predictor.llm-serving.svc.cluster.local,intel-llama.llm-serving.svc.cluster.local
          ports:
            - name: http
              containerPort: 8787
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
