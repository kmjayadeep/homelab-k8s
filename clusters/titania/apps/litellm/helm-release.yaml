apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: litellm
spec:
  interval: 1h
  chart:
    spec:
      chart: litellm-helm
      version: "1.106.4"
      sourceRef:
        kind: HelmRepository
        name: litellm
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: litellm-secrets-vault

    image:
      pullPolicy: IfNotPresent

    masterkeySecretName: litellm-secrets-vault
    masterkeySecretKey: LITELLM_MASTER_KEY

    extraEnvVars:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: DATABASE_URL
      - name: LITELLM_SALT_KEY
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: LITELLM_SALT_KEY
      - name: GEMINI_API_KEY
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: GEMINI_API_KEY
      - name: DEEPSEEK_API_KEY
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: DEEPSEEK_API_KEY
      - name: STORE_MODEL_IN_DB
        value: "True"
      - name: NUM_WORKERS
        value: "1"
      - name: NO_DOCS
        value: "True"
      - name: NO_REDOC
        value: "True"
      - name: NO_OPENAPI
        value: "True"

    db:
      useExisting: false
      deployStandalone: false

    proxy_config:
      model_list:
        # Ornith-1.5 35B-A3B 21G-ICE, the only local B60 model (ADR 0004). The model_name must match the
        # llama-server --alias in deployment-ornith.yaml.
        # The local backend is declared once here; the `local-first` router entry below merges these two
        # blocks through YAML anchors, which Kustomize expands before Flux sees the HelmRelease.
        - model_name: ornith-1.5-35b-a3b-intel
          litellm_params: &local-backend
            model: openai/ornith-1.5-35b-a3b-intel
            api_base: http://intel-llama-ornith.llm-serving.svc.cluster.local:8080/v1
            api_key: not-used
          model_info: &local-model-info
            mode: chat
            supports_reasoning: true
            # Existing local internal accounting rates, not measured operating cost.
            input_cost_per_token: 0.0000001
            cache_read_input_token_cost: 0.00000001
            output_cost_per_token: 0.000001
            # 128K configured; one benign image check passed, near-limit safety untested.
            supports_vision: true
            # Tool calls verified end to end through LiteLLM on 2026-10-17.
            supports_function_calling: true
            max_input_tokens: 114688
            max_output_tokens: 16384
        # `local-first` router (README "Routers"): the local backend above as its own deployment, so that
        # the busy signal applies only to this name: capped at the server's single slot (`--parallel 1` in
        # deployment-ornith.yaml) with a 120 s time-to-first-token budget on streamed calls. On busy, late
        # first token or backend down, router_settings.fallbacks sends the call to DeepSeek. It cannot be a
        # model_group_alias: per-deployment limits would then hit `qwen-intel` and `sensitive` too, with no
        # fallback. Nothing here needs editing when the local model changes.
        - model_name: local-first
          litellm_params:
            <<: *local-backend
            max_parallel_requests: 1
            stream_timeout: 120
          model_info: *local-model-info
        # Google Gemini Embedding 2 on the Gemini API free tier (key from Vault services/gemini/litellm).
        # Used for kagent agent memory; 768 dimensions matches kagent's vector store. rpm/tpm stay under the
        # free tier's reported limits (100 RPM, 30K TPM) so LiteLLM queues instead of getting 429s.
        - model_name: gemini-embedding-2
          litellm_params:
            model: gemini/gemini-embedding-2
            api_key: os.environ/GEMINI_API_KEY
            dimensions: 768
            rpm: 90
            tpm: 28000
          model_info:
            mode: embedding
            output_vector_size: 768
            # Free tier: no charge; keep accounting at zero.
            input_cost_per_token: 0
            output_cost_per_token: 0
        # DeepSeek (key from Vault services/deepseek/litellm, mapped to DEEPSEEK_API_KEY). Pricing, limits
        # and capabilities come from LiteLLM's cost map for the `deepseek/` provider. Moved here from the
        # Admin UI database on 2026-10-31 so routers and fallbacks can reference Git-managed entries.
        - model_name: deepseek-v4-flash
          litellm_params:
            model: deepseek/deepseek-v4-flash
            api_key: os.environ/DEEPSEEK_API_KEY
        # Fallback target for `local-first` only. DeepSeek's thinking mode rejects a multi-turn tool
        # conversation unless every earlier assistant turn carries its `reasoning_content`; a run that
        # started on the local model has none, so with thinking on every mid-run fallback failed with a
        # 400 (reproduced 2026-11-14). `frontier` keeps thinking: its runs are DeepSeek from turn one.
        - model_name: deepseek-v4-flash-fallback
          litellm_params:
            model: deepseek/deepseek-v4-flash
            api_key: os.environ/DEEPSEEK_API_KEY
            reasoning_effort: none
        - model_name: deepseek-v4-pro
          litellm_params:
            model: deepseek/deepseek-v4-pro
            api_key: os.environ/DEEPSEEK_API_KEY
      router_settings:
        model_group_alias:
          qwen-intel: ornith-1.5-35b-a3b-intel
          # Routers without their own limits are aliases. `sensitive`: local only, never leaves the cluster,
          # queues at the server. `frontier`: the Git-managed DeepSeek entry above. The database also stores
          # this alias map (alias drift, README), so check /router/settings after merging an alias change.
          sensitive: ornith-1.5-35b-a3b-intel
          frontier: deepseek-v4-flash
        # `local-first` router: DeepSeek when the local slot is busy, the first token is late or the backend
        # is unreachable. With STORE_MODEL_IN_DB the database overlays keys it holds; `fallbacks` and
        # `retry_policy` are not stored there (checked 2026-10-30), so these values apply.
        fallbacks:
          - local-first:
              - deepseek-v4-flash-fallback
        # A timed-out call is not retried on the same group (each retry would wait another stream_timeout
        # or request_timeout before falling back). Other errors keep the default two retries.
        retry_policy:
          TimeoutErrorRetries: 0
      litellm_settings:
        json_logs: true
        request_timeout: 600
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
        database_connection_pool_limit: 2
        disable_master_key_return: true
        # Spend logs are most of Helios Postgres and its hourly dump. Daily rollups are kept.
        maximum_spend_logs_retention_period: "30d"
      # kagent agents on the A2A gateway (README "kagent agents"). kagent's cards report protocol 0.3.
      agents:
        - agent_name: homelab-sre
          agent_card_params:
            name: homelab-sre
            description: Read-only SRE for the titania homelab cluster.
            url: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/homelab-sre/
            protocolVersion: "0.3"
            capabilities:
              streaming: true
        - agent_name: homelab-gitops
          agent_card_params:
            name: homelab-gitops
            description: Turns a requested homelab change into a pull request. Never merges.
            url: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/homelab-gitops/
            protocolVersion: "0.3"
            capabilities:
              streaming: true
        - agent_name: music-curator
          agent_card_params:
            name: music-curator
            description: Finds new music from the Jellyfin library and digest feedback.
            url: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/music-curator/
            protocolVersion: "0.3"
            capabilities:
              streaming: true
        - agent_name: movie-curator
          agent_card_params:
            name: movie-curator
            description: Finds movies from Jellyfin watch history, Radarr and digest feedback.
            url: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/movie-curator/
            protocolVersion: "0.3"
            capabilities:
              streaming: true
        - agent_name: vartha-editor
          agent_card_params:
            name: vartha-editor
            description: Writes editions of Valheim Vartha from a digest of game events.
            url: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/vartha-editor/
            protocolVersion: "0.3"
            capabilities:
              streaming: true

    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/app-root: /ui
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        # Default 1m rejects long-context and base64 image requests with 413.
        nginx.ingress.kubernetes.io/proxy-body-size: "64m"
      hosts:
        - host: litellm.cosmos.cboxlab.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - litellm.cosmos.cboxlab.com
          secretName: cosmos-cboxlab-cert

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    migrationJob:
      enabled: true
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 4Gi

    autoscaling:
      enabled: false

    redis:
      enabled: false
