apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: litellm
spec:
  interval: 1h
  chart:
    spec:
      chart: litellm-helm
      version: "1.106.4"
      sourceRef:
        kind: HelmRepository
        name: litellm
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: litellm-secrets-vault

    image:
      pullPolicy: IfNotPresent

    masterkeySecretName: litellm-secrets-vault
    masterkeySecretKey: LITELLM_MASTER_KEY

    extraEnvVars:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: DATABASE_URL
      - name: LITELLM_SALT_KEY
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: LITELLM_SALT_KEY
      - name: GEMINI_API_KEY
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: GEMINI_API_KEY
      - name: DEEPSEEK_API_KEY
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: DEEPSEEK_API_KEY
      - name: STORE_MODEL_IN_DB
        value: "True"
      - name: NUM_WORKERS
        value: "1"
      - name: NO_DOCS
        value: "True"
      - name: NO_REDOC
        value: "True"
      - name: NO_OPENAPI
        value: "True"

    db:
      useExisting: false
      deployStandalone: false

    proxy_config:
      model_list:
        # Ornith-1.5 35B-A3B 21G-ICE, the only local B60 model (ADR 0004). The model_name must match the
        # llama-server --alias in deployment-ornith.yaml.
        - model_name: ornith-1.5-35b-a3b-intel
          litellm_params:
            model: openai/ornith-1.5-35b-a3b-intel
            api_base: http://intel-llama-ornith.llm-serving.svc.cluster.local:8080/v1
            api_key: not-used
          model_info:
            mode: chat
            supports_reasoning: true
            # Existing local internal accounting rates, not measured operating cost.
            input_cost_per_token: 0.0000001
            cache_read_input_token_cost: 0.00000001
            output_cost_per_token: 0.000001
            # 128K configured; one benign image check passed, near-limit safety untested.
            supports_vision: true
            # Tool calls verified end to end through LiteLLM on 2026-10-17.
            supports_function_calling: true
            max_input_tokens: 114688
            max_output_tokens: 16384
        # Google Gemini Embedding 2 on the Gemini API free tier (key from Vault services/gemini/litellm).
        # Used for kagent agent memory; 768 dimensions matches kagent's vector store. rpm/tpm stay under the
        # free tier's reported limits (100 RPM, 30K TPM) so LiteLLM queues instead of getting 429s.
        - model_name: gemini-embedding-2
          litellm_params:
            model: gemini/gemini-embedding-2
            api_key: os.environ/GEMINI_API_KEY
            dimensions: 768
            rpm: 90
            tpm: 28000
          model_info:
            mode: embedding
            output_vector_size: 768
            # Free tier: no charge; keep accounting at zero.
            input_cost_per_token: 0
            output_cost_per_token: 0
        # DeepSeek (key from Vault services/deepseek/litellm, mapped to DEEPSEEK_API_KEY). Pricing, limits
        # and capabilities come from LiteLLM's cost map for the `deepseek/` provider. Moved here from the
        # Admin UI database on 2026-10-31 so routers and fallbacks can reference Git-managed entries.
        - model_name: deepseek-v4-flash
          litellm_params:
            model: deepseek/deepseek-v4-flash
            api_key: os.environ/DEEPSEEK_API_KEY
        - model_name: deepseek-v4-pro
          litellm_params:
            model: deepseek/deepseek-v4-pro
            api_key: os.environ/DEEPSEEK_API_KEY
      router_settings:
        model_group_alias:
          qwen-intel: ornith-1.5-35b-a3b-intel
      litellm_settings:
        json_logs: true
        request_timeout: 600
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
        database_connection_pool_limit: 2
        disable_master_key_return: true

    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/app-root: /ui
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        # Default 1m rejects long-context and base64 image requests with 413.
        nginx.ingress.kubernetes.io/proxy-body-size: "64m"
      hosts:
        - host: litellm.cosmos.cboxlab.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - litellm.cosmos.cboxlab.com
          secretName: cosmos-cboxlab-cert

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    migrationJob:
      enabled: true
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 4Gi

    autoscaling:
      enabled: false

    redis:
      enabled: false
