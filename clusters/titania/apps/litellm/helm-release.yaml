apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: litellm
spec:
  interval: 1h
  chart:
    spec:
      chart: litellm-helm
      version: "1.90.0"
      sourceRef:
        kind: HelmRepository
        name: litellm
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: litellm-secrets-vault

    image:
      pullPolicy: IfNotPresent

    masterkeySecretName: litellm-secrets-vault
    masterkeySecretKey: LITELLM_MASTER_KEY

    extraEnvVars:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: DATABASE_URL
      - name: LITELLM_SALT_KEY
        valueFrom:
          secretKeyRef:
            name: litellm-secrets-vault
            key: LITELLM_SALT_KEY
      - name: STORE_MODEL_IN_DB
        value: "True"
      - name: NUM_WORKERS
        value: "1"
      - name: NO_DOCS
        value: "True"
      - name: NO_REDOC
        value: "True"
      - name: NO_OPENAPI
        value: "True"

    db:
      useExisting: false
      deployStandalone: false

    proxy_config:
      model_list:
        - model_name: empero-qwen3.8-35b-a3b-iq3m-intel
          litellm_params:
            model: openai/empero-qwen3.8-35b-a3b-iq3m-intel
            api_base: http://intel-llama-empero-qwen38-trial.llm-serving.svc.cluster.local:8080/v1
            api_key: not-used
          model_info:
            mode: chat
            supports_reasoning: true
            # Benign image tests passed at short and near-256K active context.
            supports_vision: true
            # Two direct tool tests failed to return structured calls; do not advertise tools.
            supports_function_calling: false
            # 256K total; reserve 16K generation. No pricing supplied for this trial.
            max_input_tokens: 245760
            max_output_tokens: 16384
        - model_name: swift-qwen3.8-27b-q4ks-intel
          litellm_params:
            model: openai/swift-qwen3.8-27b-q4ks-intel
            api_base: http://intel-llama-swift-qwen38-trial.llm-serving.svc.cluster.local:8080/v1
            api_key: not-used
          model_info:
            mode: chat
            supports_reasoning: true
            # A benign required-tool request returned a structured function call via LiteLLM.
            supports_function_calling: true
            # Pinned F16 projector: one benign image request succeeded; broader vision quality untested.
            supports_vision: true
            # Reuse internal accounting rates; not an upstream charge or measured cost.
            input_cost_per_token: 0.0000001
            cache_read_input_token_cost: 0.00000001
            output_cost_per_token: 0.000001
            # 96K configured with mmproj; near-limit active depth is untested.
            max_input_tokens: 81920
            max_output_tokens: 16384
        - model_name: tiel-coder-35b-a3b-intel
          litellm_params:
            model: openai/tiel-coder-35b-a3b-intel
            api_base: http://intel-llama-tiel-coder-trial.llm-serving.svc.cluster.local:8080/v1
            api_key: not-used
          model_info:
            mode: chat
            supports_reasoning: true
            # Existing local internal accounting rates, not measured operating cost.
            input_cost_per_token: 0.0000001
            cache_read_input_token_cost: 0.00000001
            output_cost_per_token: 0.000001
            # 128K configured; one benign image check passed, near-limit safety untested.
            supports_vision: true
            supports_function_calling: false
            max_input_tokens: 114688
            max_output_tokens: 16384
        - model_name: qwen3.8-27b-autoround-intel
          litellm_params:
            model: openai/qwen3.8-27b-autoround-intel
            api_base: http://intel-llama-qwen38-autoround-trial.llm-serving.svc.cluster.local:8080/v1
            api_key: not-used
          model_info:
            mode: chat
            supports_reasoning: true
            # Internal accounting rates only, not measured operating cost.
            input_cost_per_token: 0.0000001
            cache_read_input_token_cost: 0.00000001
            output_cost_per_token: 0.000001
            # 80K configured context; deep active prompts still need safety validation.
            # No tool-use reliability or vision support established.
            max_input_tokens: 65536
            max_output_tokens: 16384
        - model_name: qwen3.8-27b-intel-test
          litellm_params:
            model: openai/qwen3.8-27b-intel-test
            api_base: http://intel-llama-qwen38-arc-mtp-trial.llm-serving.svc.cluster.local:8080/v1
            api_key: not-used
          model_info:
            mode: chat
            supports_reasoning: true
            # Reuse existing internal accounting rates (USD/token), not measured costs.
            input_cost_per_token: 0.0000001
            cache_read_input_token_cost: 0.00000001
            output_cost_per_token: 0.000001
            # Tool reliability has not been evaluated for this artifact.
            max_input_tokens: 114688
            max_output_tokens: 16384
        - model_name: qwen3.6-35b-a3b-intel
          litellm_params:
            model: openai/qwen3.6-35b-a3b-intel
            api_base: http://intel-llama.llm-serving.svc.cluster.local:8080/v1
            api_key: not-used
          model_info:
            mode: chat
            supports_reasoning: true
            supports_function_calling: true
            # Internal accounting rates (USD/token), not an upstream bill.
            input_cost_per_token: 0.0000001
            cache_read_input_token_cost: 0.00000001
            output_cost_per_token: 0.000001
            max_input_tokens: 114688
            max_output_tokens: 16384
        - model_name: qwen3.6-27b-intel
          litellm_params:
            model: openai/qwen3.6-27b-intel-trial
            api_base: http://intel-vllm.llm-serving.svc.cluster.local:8000/v1
            api_key: not-used
          model_info:
            mode: chat
            supports_reasoning: true
            supports_function_calling: true
            # Reuse the established local accounting rates (USD/token).
            input_cost_per_token: 0.0000001
            cache_read_input_token_cost: 0.00000001
            output_cost_per_token: 0.000001
            # 80K server window: reserve 16K for generation.
            max_input_tokens: 65536
            max_output_tokens: 16384
      router_settings:
        model_group_alias:
          qwen-intel: tiel-coder-35b-a3b-intel
      litellm_settings:
        json_logs: true
        request_timeout: 600
      general_settings:
        master_key: os.environ/PROXY_MASTER_KEY
        database_connection_pool_limit: 2
        disable_master_key_return: true

    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/app-root: /ui
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      hosts:
        - host: litellm.cosmos.cboxlab.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - litellm.cosmos.cboxlab.com
          secretName: cosmos-cboxlab-cert

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    migrationJob:
      enabled: true
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 4Gi

    autoscaling:
      enabled: false

    redis:
      enabled: false
