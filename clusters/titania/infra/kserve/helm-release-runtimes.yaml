apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-runtime-configs
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: kserve-runtime-configs
  dependsOn:
    - name: kserve-resources
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kserve:
      servingruntime:
        enabled: true
        tensorflow:
          disabled: true
        mlserver:
          disabled: true
        sklearnserver:
          disabled: false
        xgbserver:
          disabled: true
        huggingfaceserver:
          disabled: true
        huggingfaceserver_multinode:
          disabled: true
        tritonserver:
          disabled: true
        pmmlserver:
          disabled: true
        predictiveserver:
          disabled: true
        paddleserver:
          disabled: true
        lgbserver:
          disabled: true
        autogluonserver:
          disabled: true
        torchserve:
          disabled: true
        vllmserver:
          disabled: true
