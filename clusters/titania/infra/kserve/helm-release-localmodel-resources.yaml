apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-localmodel-resources
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: kserve-localmodel-resources
  dependsOn:
    - name: kserve-resources
    - name: kserve-localmodel-crd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kserve:
      localmodel:
        enabled: true
