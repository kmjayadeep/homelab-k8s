apiVersion: apps/v1
kind: Deployment
metadata:
  name: restic-exporter
  labels:
    app.kubernetes.io/name: restic-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: restic-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restic-exporter
      annotations:
        prometheus.io/port: "18090"
        prometheus.io/scrape: "true"
    spec:
      containers:
      - name: restic-exporter
        image: "kmjayadeep/restic-exporter:0.7.0"
        ports:
          - name: http-metrics
            containerPort: 18090
            protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http-metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: http-metrics
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        secret:
          secretName: restic-config-vault
          items:
          - key: config.yaml
            path: config.yaml
