apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault-restic
  namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-restic
  namespace: monitoring
spec:
  provider:
    vault:
      server: https://vault.vault.svc.cluster.local:8200
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        key: ca.crt
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitoring-restic
          serviceAccountRef:
            name: external-secrets-vault-restic
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-config-vault
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-restic
  target:
    name: restic-config-vault
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: config.yaml
      remoteRef:
        key: platform/backup/restic-exporter
        property: config
