---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: cilium
      version: '1.20.3'
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 1m
  values:
    ipv6:
      enabled: true
    cluster:
      name: cosmos
    operator:
      replicas: 1

    ipam:
      mode: kubernetes
      operator:
        clusterPoolIPv6PodCIDRList:
        - 2001:cafe:42::/96
        clusterPoolIPv4PodCIDRList:
        - 10.42.0.0/16
        clusterPoolIPv6MaskSize: 112

    enableIPv6Masquerade: true

    # Pin the underlay MTU to eth0 (1500 on every node). Auto-detection on
    # titania-master picked up tailscale0 (MTU 1280), which set cilium_host,
    # cilium_vxlan and pod veths to 1280 and the overlay routes to 1230. That
    # is below the IPv6 minimum MTU (1280), so IPv6 clients cannot honour the
    # resulting "packet too big" and traffic forwarded through the master to
    # pods on other nodes stalls. Other nodes auto-detect 1500/1450 correctly.
    MTU: 1500

    # Restart agents when cilium-config changes; otherwise values such as MTU
    # only take effect on the next unrelated agent restart.
    rollOutCiliumPods: true

    k8sServiceHost: 192.168.1.70
    k8sServicePort: 6443

    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
        ingress:
          enabled: true
          hosts:
          - hubble.cosmos.cboxlab.com
          tls:
          - secretName: cosmos-cboxlab-cert
            hosts:
            - "*.cosmos.cboxlab.com"
