apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    # Stateful: never let Flux garbage-collect this, even if the manifest is
    # renamed or removed. Deleting it must be a deliberate manual action.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: longhorn
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
  interval: 1h0m0s
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    longhornUI:
      replicas: 1
    ingress:
      enabled: true
      host: longhorn.cosmos.cboxlab.com
      tls: true
      tlsSecret: cosmos-cboxlab-cert
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
    defaultSettings:
      # System-managed components, including the CSI node plugin, must be able
      # to mount and unmount volumes for workloads on the dedicated AI node.
      taintToleration: workload=ai:NoSchedule
      # Two replicas (one per Longhorn node) since 2026-10-28: the master reboot during the k3s upgrade
      # faulted the two volumes that were down to a single replica, and single-replica volumes cannot
      # survive any node outage. Existing volumes keep their own numberOfReplicas; see the Longhorn notes.
      defaultReplicaCount: 2
      # Valid values: disabled | least-effort | best-effort. "true" is invalid
      # and made longhorn-manager reject the WHOLE default-setting ConfigMap
      # ("Customized settings are invalid, will give up using them"), so none
      # of these defaults were applied (live default-replica-count stayed 3,
      # engine auto-upgrade stayed 0).
      replicaAutoBalance: least-effort
      # Let Longhorn live-upgrade volume engines to the new default engine
      # after each manager upgrade (3 per node, the upstream recommendation).
      # Engines lagging a minor behind block the next minor upgrade; see
      # plans/0016-longhorn-1.9-to-1.13-upgrade.md.
      concurrentAutomaticEngineUpgradePerNodeLimit: 3
      # Semicolon-separated list of orphan types Longhorn may delete on its own
      # (empty = disabled). Leftover replica directories from node/longhorn-manager
      # restarts were never reclaimed: 65 orphans.longhorn.io replica objects on
      # titania-worker1 (DataCleanable=True) while only ~5 GiB of live replica data
      # existed there, and /var/lib/longhorn on the root filesystem ratcheted up
      # ~17 GiB, ~25 GiB and ~10 GiB across the restarts of 2026-10-23, 10-26 and
      # 10-28. Narrow to "replica-data" if deleting stale instance managers proves
      # too aggressive.
      orphanResourceAutoDeletion: "replica-data;instance"
    defaultBackupStore:
      backupTarget: nfs://truenas.cosmos.cboxlab.com:/mnt/main/k8s/longhorn-backup
    persistence:
      defaultFsType: "xfs"
      defaultClass: false
      defaultClassReplicaCount: 2
      recurringJobSelector:
        enable: true
        jobList: '[{"name":"daily", "isGroup":true}]'
