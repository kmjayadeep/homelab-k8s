apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: titania-master
  namespace: longhorn-system
  annotations:
    # Stateful: never let Flux garbage-collect this, even if the manifest is
    # renamed or removed. Deleting it must be a deliberate manual action.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  allowScheduling: true
  disks:
    default-disk-3d9ed4355da69325:
      allowScheduling: true
      diskDriver: ""
      diskType: filesystem
      evictionRequested: false
      path: /var/lib/longhorn/
      storageReserved: 50000000000
      tags: []
  evictionRequested: false
  instanceManagerCPURequest: 0
  name: titania-master
  tags: []
