apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-prometheus
  namespace: longhorn-system
  labels:
    app.kubernetes.io/name: longhorn
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/component: monitoring
spec:
  # Chart 1.12 ships networkPolicies.restrictInternalTraffic=true, whose
  # "longhorn-manager" policy admits only Longhorn components. Policies are
  # additive, so this one re-opens the manager metrics port for the
  # kube-prometheus-stack Prometheus (ServiceMonitor in
  # clusters/titania/infra/monitoring/longhorn/).
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9500
