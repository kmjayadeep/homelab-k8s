apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: "2.2.16"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: reloader
  values:
    fullnameOverride: reloader
    reloader:
      reloadStrategy: annotations
      watchGlobally: false
      namespaces:
        - baskit
        - external-dns
      ignoreJobs: true
      ignoreCronJobs: true
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
