apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 1h0m0s
  chart:
    spec:
      # https://artifacthub.io/packages/helm/cert-manager/trust-manager
      chart: trust-manager
      version: 'v0.25.0'
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    # Only private CAs are distributed; the public CA package is not needed.
    defaultPackage:
      enabled: false
    app:
      trust:
        namespace: cert-manager
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
