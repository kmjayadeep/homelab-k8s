apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-router
  namespace: envoy-ai-gateway-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: agent-router
  dependsOn:
    - name: agent-router-crds
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    controller:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
