apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: kserve-vllmserver-rocm
  annotations:
    serving.kserve.io/server-type: vllmserver
spec:
  annotations:
    prometheus.kserve.io/port: "8080"
    prometheus.kserve.io/path: "/metrics"
  supportedModelFormats:
    - name: vLLM
      version: "1"
      autoSelect: false
      priority: 1
  containers:
    - name: kserve-container
      image: vllm/vllm-openai-rocm:v0.29.0@sha256:e5e47f6aaab675c252c381f0dac237b31b10d87bb74d092b07fb4065efd7f5a1
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--served-model-name={{.Name}}"
        - "--model=/mnt/models"
      env:
        - name: HF_HOME
          value: /tmp
        - name: VLLM_CONFIG_ROOT
          value: /tmp
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - SYS_PTRACE
        seccompProfile:
          type: Unconfined
      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8080
        failureThreshold: 3
        periodSeconds: 10
        timeoutSeconds: 5
      startupProbe:
        httpGet:
          path: /v1/models
          port: 8080
        failureThreshold: 60
        periodSeconds: 30
        timeoutSeconds: 10
        initialDelaySeconds: 30
      volumeMounts:
        - name: devshm
          mountPath: /dev/shm
  volumes:
    - name: devshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
