apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 5m
  chart:
    spec:
      chart: ingress-nginx
      version: '4.15.1'
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
      interval: 1m
  install:
    # Avoid waiting for resources to be ready on first install
    # Otherwise this might fail when LB IP is not ready
    disableWait: true
  values:
    controller:
      watchIngressWithoutClass: true
      extraArgs:
        default-ssl-certificate: ingress-nginx/cosmos-cboxlab-cert
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      service:
        loadBalancerIP:  # Set in env specific patches
        # Cluster, not Local: with k3s kube-proxy in IPVS mode on the master and
        # Cilium delivering overlay replies straight to pods, eTP=Local breaks
        # pod -> LoadBalancer IP (hairpin) traffic from nodes without a local
        # ingress endpoint. Cluster masquerades that traffic so the reply path
        # is symmetric. Costs client source IPs in ingress logs.
        externalTrafficPolicy: Cluster
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
        - IPv4
        - IPv6
