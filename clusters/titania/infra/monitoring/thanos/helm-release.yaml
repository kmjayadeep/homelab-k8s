apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: monitoring
spec:
  chart:
    spec:
      chart: thanos
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: monitoring
      version: "13.4.1"
  interval: 1h0m0s
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    global:
      security:
        # Chart >= 15.9 refuses to render with a non-default image repository
        # unless this is set. We deliberately run bitnamilegacy/thanos because
        # the free bitnami/ catalog stopped publishing tags in Aug 2025.
        allowInsecureImages: true
    image:
      repository: bitnamilegacy/thanos
    existingObjstoreSecret: thanos-s3-vault
    query:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
      stores:
      - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.monitoring.svc.cluster.local
      ingress:
        enabled: true
        hostname: thanos-query.cosmos.cboxlab.com
        tls: true
        extraTls:
        - secretName: cosmos-cboxlab-cert
          hosts:
          - "*.cosmos.cboxlab.com"
    queryFrontend:
      # Enabled by default
      enabled: false
    compactor:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
      ingress:
        enabled: true
        hostname: thanos-compact.cosmos.cboxlab.com
        tls: true
        extraTls:
        - secretName: cosmos-cboxlab-cert
          hosts:
          - "*.cosmos.cboxlab.com"
      persistence:
        enabled: false
    storegateway:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      persistence:
        enabled: false
