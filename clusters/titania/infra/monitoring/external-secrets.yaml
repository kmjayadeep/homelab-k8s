apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault-alertmanager
  namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-alertmanager
  namespace: monitoring
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitoring-alertmanager
          serviceAccountRef:
            name: external-secrets-vault-alertmanager
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config-vault
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-alertmanager
  target:
    name: alertmanager-config-vault
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: alertmanager.yaml
      remoteRef:
        key: platform/monitoring/alertmanager
        property: config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault-grafana
  namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-grafana
  namespace: monitoring
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: homelab/kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitoring-grafana
          serviceAccountRef:
            name: external-secrets-vault-grafana
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-creds-vault
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-grafana
  target:
    name: grafana-creds-vault
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/monitoring/grafana-admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: platform/monitoring/grafana-admin
        property: password
