apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: monitoring
spec:
  chart:
    spec:
      chart: promtail
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      version: "6.17.1"
  interval: 1h0m0s
  values:
    onfig:
      # publish data to loki
      clients:
        - url: http://loki-gateway/loki/api/v1/push
          tenant_id: 1
    # Helm replaces list values instead of merging them, so the two
    # control-plane tolerations the chart would otherwise add are restated
    # here; the third one admits promtail to the tainted GPU node.
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: workload
        operator: Equal
        value: ai
        effect: NoSchedule
