apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metallb-system

resources:
- github.com/metallb/metallb/config/native?ref=v0.16.1
- l2advertisement.yaml
- public-pool.yaml

# The Namespace is owned by the bootstrap Kustomization (bootstrap/infra/02-metallb.yaml).
patches:
- target:
    kind: Namespace
    name: metallb-system
  patch: |
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: metallb-system
