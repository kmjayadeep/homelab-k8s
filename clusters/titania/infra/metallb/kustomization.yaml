apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metallb-system

resources:
# Pinned to the immutable commit that v0.16.2 points to (annotated tag
# d3684040055973b1735a98b31e597943541aa761 -> commit 37f0586) instead of the
# mutable tag. The remote base is re-fetched by kustomize-controller on every
# reconcile, and the tag form failed with a 27s `git fetch` timeout
# (BuildFailed, 2026-11-18T19:28Z and 19:44:01Z). A SHA makes the build
# reproducible. This does not remove the fetch itself: if the timeouts persist,
# vendor the native config into this directory or move to the metallb chart.
- github.com/metallb/metallb/config/native?ref=37f058643f74370e53f2c66220b11da9d37f1141
- l2advertisement.yaml
- public-pool.yaml

# The Namespace is owned by the bootstrap Kustomization (bootstrap/infra/02-metallb.yaml);
# drop the copy the upstream base ships so only one Flux Kustomization applies it.
patches:
- target:
    kind: Namespace
    name: metallb-system
  patch: |
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: metallb-system
