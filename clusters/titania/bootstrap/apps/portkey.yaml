apiVersion: v1
kind: Namespace
metadata:
  name: portkey
  labels:
    app.kubernetes.io/name: portkey
    app.kubernetes.io/instance: portkey
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portkey
  namespace: flux-system
spec:
  path: clusters/titania/apps/portkey
  dependsOn:
    - name: ingress-nginx
      namespace: ingress-nginx
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
