apiVersion: v1
kind: Namespace
metadata:
  name: kserve-smoke
  labels:
    app.kubernetes.io/name: kserve-smoke
    app.kubernetes.io/instance: kserve-smoke
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kserve-smoke
  namespace: kserve-smoke
spec:
  path: clusters/titania/apps/kserve-smoke
  dependsOn:
    - name: kserve
      namespace: kserve
  interval: 15m
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      name: sklearn-iris
      namespace: kserve-smoke
