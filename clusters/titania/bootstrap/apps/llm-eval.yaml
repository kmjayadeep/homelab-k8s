apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-eval
  namespace: llm-serving
spec:
  path: clusters/titania/apps/llm-eval
  dependsOn:
    - name: actions-runner
      namespace: actions-runner-system
    - name: llm-serving-intel-llama
      namespace: llm-serving
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
