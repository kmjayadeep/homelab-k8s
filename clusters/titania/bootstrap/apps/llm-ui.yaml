apiVersion: v1
kind: Namespace
metadata:
  name: llm-ui
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-ui
  namespace: flux-system
spec:
  path: clusters/titania/apps/llm-ui
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
