apiVersion: v1
kind: Namespace
metadata:
  name: vault
  annotations:
    # Stateful: never let Flux garbage-collect this, even if the manifest is
    # renamed or removed. Deleting it must be a deliberate manual action.
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault
  namespace: vault
spec:
  path: clusters/titania/apps/vault
  dependsOn:
  # Issues the listener certificate and publishes ConfigMap vault-ca-cert.
  - name: vault-pki
    namespace: cert-manager
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: vault
