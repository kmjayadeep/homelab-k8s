apiVersion: v1
kind: Namespace
metadata:
  name: llm-serving
  labels:
    app.kubernetes.io/name: llm-serving
    app.kubernetes.io/instance: llm-serving
---
# Runtime GPU selection, written by the GPU portal (ADR 0009). Flux only creates it if absent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-active
  namespace: llm-serving
  labels:
    app.kubernetes.io/name: llm-serving
    app.kubernetes.io/instance: llm-serving
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  ORNITH_REPLICAS: "1"
  SWIFT_REPLICAS: "0"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-serving-intel-llama
  namespace: llm-serving
spec:
  path: clusters/titania/apps/llm-serving-intel-llama
  dependsOn:
    - name: intel-gpu
      namespace: intel-gpu
  interval: 15m
  prune: true
  # Not wait: true, which would also health-check Swift's PVC. local-path binds it only on Swift's first start.
  wait: false
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # The GPU portal selects the owner; these defaults apply if gpu-active is missing.
  patches:
    - target:
        kind: Deployment
        name: intel-llama-ornith
      patch: |
        - op: replace
          path: /spec/replicas
          value: ${ORNITH_REPLICAS:=1}
    - target:
        kind: Deployment
        name: intel-llama-swift
      patch: |
        - op: replace
          path: /spec/replicas
          value: ${SWIFT_REPLICAS:=0}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gpu-active
        optional: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: intel-llama-ornith
      namespace: llm-serving
    - apiVersion: apps/v1
      kind: Deployment
      name: intel-llama-swift
      namespace: llm-serving
