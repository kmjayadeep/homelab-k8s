apiVersion: v1
kind: Namespace
metadata:
  name: postgres-restore-drill
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-restore-drill
  namespace: postgres-restore-drill
spec:
  path: clusters/titania/apps/postgres-restore-drill
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: batch/v1
      kind: CronJob
      name: postgres-restore-drill
