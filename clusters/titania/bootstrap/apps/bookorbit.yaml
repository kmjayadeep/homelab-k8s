apiVersion: v1
kind: Namespace
metadata:
  name: bookorbit
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  path: clusters/titania/apps/bookorbit
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: bookorbit
    - apiVersion: apps/v1
      kind: Deployment
      name: bookorbit-postgres
