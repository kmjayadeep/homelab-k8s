apiVersion: v1
kind: Namespace
metadata:
  name: comfyui
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: comfyui
  namespace: comfyui
spec:
  path: clusters/titania/apps/comfyui
  dependsOn:
    - name: intel-gpu
      namespace: intel-gpu
  interval: 15m
  prune: true
  wait: true
  # First start pulls a 7 GB image and downloads the 6.94 GB checkpoint, after Ornith releases the GPU.
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
