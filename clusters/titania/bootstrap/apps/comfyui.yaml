apiVersion: v1
kind: Namespace
metadata:
  name: comfyui
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: comfyui
  namespace: comfyui
spec:
  path: clusters/titania/apps/comfyui
  dependsOn:
    - name: intel-gpu
      namespace: intel-gpu
  interval: 15m
  prune: true
  wait: true
  # Model download plus a 7 GB image pull on first start when the owner is swapped in.
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    # Passes at the Git default of 0 replicas (kstatus treats a 0-replica Deployment as Current).
    - apiVersion: apps/v1
      kind: Deployment
      name: comfyui
      namespace: comfyui
