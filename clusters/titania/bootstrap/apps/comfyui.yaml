apiVersion: v1
kind: Namespace
metadata:
  name: comfyui
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
---
# Runtime GPU selection, written by the GPU portal (ADR 0009). Flux only creates it if absent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-active
  namespace: comfyui
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  COMFYUI_REPLICAS: "0"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: comfyui
  namespace: comfyui
spec:
  path: clusters/titania/apps/comfyui
  dependsOn:
    - name: intel-gpu
      namespace: intel-gpu
  interval: 15m
  prune: true
  # No health checks: a reconcile waiting on a slow or failing start would hold back the next GPU switch.
  # The GPU portal reports rollout state from the pods (ADR 0009).
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # The GPU portal selects the owner; these defaults apply if gpu-active is missing.
  patches:
    - target:
        kind: Deployment
        name: comfyui
      patch: |
        - op: replace
          path: /spec/replicas
          value: ${COMFYUI_REPLICAS:=0}
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: gpu-active
        optional: true
