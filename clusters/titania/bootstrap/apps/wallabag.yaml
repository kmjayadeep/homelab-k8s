apiVersion: v1
kind: Namespace
metadata:
  name: wallabag
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wallabag
  namespace: wallabag
spec:
  path: clusters/titania/apps/wallabag
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: wallabag
