apiVersion: v1
kind: Namespace
metadata:
  name: gpu-portal
  labels:
    app.kubernetes.io/name: gpu-portal
    app.kubernetes.io/instance: gpu-portal
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu-portal
  namespace: gpu-portal
spec:
  path: clusters/titania/apps/gpu-portal
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
