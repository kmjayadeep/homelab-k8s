apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  path: clusters/titania/apps/llm-gateway
  dependsOn:
    - name: agent-router
      namespace: envoy-ai-gateway-system
    - name: external-secrets
      namespace: external-secrets
    - name: kserve
      namespace: kserve
  interval: 15m
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
