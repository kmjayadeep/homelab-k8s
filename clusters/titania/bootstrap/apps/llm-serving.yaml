apiVersion: v1
kind: Namespace
metadata:
  name: llm-serving
  labels:
    app.kubernetes.io/name: llm-serving
    app.kubernetes.io/instance: llm-serving
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-serving
  namespace: llm-serving
spec:
  path: clusters/titania/apps/llm-serving
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: kserve-localmodel
      namespace: kserve
  interval: 15m
  prune: true
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      name: smollm2-135m
      namespace: llm-serving
  healthCheckExprs:
    - apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      current: >-
        has(status.conditions) &&
        status.conditions.exists(condition,
          condition.type == 'Ready' && condition.status == 'True')
      inProgress: >-
        !has(status.conditions) ||
        !status.conditions.exists(condition,
          condition.type == 'Ready' && condition.status == 'True')
