apiVersion: v1
kind: Namespace
metadata:
  name: llm-serving
  labels:
    app.kubernetes.io/name: llm-serving
    app.kubernetes.io/instance: llm-serving
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-serving
  namespace: llm-serving
spec:
  path: clusters/titania/apps/llm-serving
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: kserve-localmodel
      namespace: kserve
  interval: 15m
  prune: true
  wait: false
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: smollm2-135m-predictor
      namespace: llm-serving
