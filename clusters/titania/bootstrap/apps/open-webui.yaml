apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
  namespace: open-webui
spec:
  path: clusters/titania/apps/open-webui
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: reloader
      namespace: reloader
    - name: litellm
      namespace: litellm
  interval: 15m
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: open-webui
