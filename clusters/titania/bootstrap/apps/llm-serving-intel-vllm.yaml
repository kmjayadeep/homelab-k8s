apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-serving-intel-vllm
  namespace: llm-serving
spec:
  path: clusters/titania/apps/llm-serving-intel-vllm
  dependsOn:
    - name: intel-gpu
      namespace: intel-gpu
  interval: 15m
  prune: true
  wait: true
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: intel-vllm
      namespace: llm-serving
