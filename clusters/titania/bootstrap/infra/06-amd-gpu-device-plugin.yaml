apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: amd-gpu-device-plugin
  namespace: kube-system
spec:
  path: clusters/titania/infra/amd-gpu-device-plugin
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: amd-gpu-device-plugin
      namespace: kube-system
