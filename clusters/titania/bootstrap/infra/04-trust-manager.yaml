apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  path: clusters/titania/infra/trust-manager
  dependsOn:
  - name: cert-manager
    namespace: cert-manager
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: trust-manager
      namespace: cert-manager
