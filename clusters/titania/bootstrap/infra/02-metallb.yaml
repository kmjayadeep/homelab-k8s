apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  # Step 1 of handing this Namespace to a single owner: carry the labels the upstream MetalLB
  # base sets, so both Kustomizations render the same labels while the base still ships one.
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: metallb-system
spec:
  path: clusters/titania/infra/metallb
  interval: 15m
  # Step 1: pruning is off while Namespace/metallb-system leaves this Kustomization's inventory
  # (step 2 deletes it from the upstream base). Both Kustomizations have been applying the
  # Namespace with the same field manager, so the owner label flips and a prune could remove the
  # live Namespace. Re-enable (step 3) once the inventory no longer lists the Namespace.
  prune: false
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: metallb
