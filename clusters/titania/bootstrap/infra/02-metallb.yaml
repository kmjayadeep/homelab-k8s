apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  # Sole owner of this Namespace: the copy the upstream MetalLB base ships is deleted in
  # infra/metallb/kustomization.yaml. Two Kustomizations applying it flipped the owner label
  # every reconcile and emitted a "configured" Flux event each time.
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: metallb-system
spec:
  path: clusters/titania/infra/metallb
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: metallb
