apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kserve-rocm
  namespace: kserve
spec:
  path: clusters/titania/infra/kserve-rocm
  dependsOn:
    - name: kserve
      namespace: kserve
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: serving.kserve.io/v1alpha1
      kind: ClusterServingRuntime
      name: kserve-vllmserver-rocm
