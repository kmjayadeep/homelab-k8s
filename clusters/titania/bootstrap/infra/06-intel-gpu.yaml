apiVersion: v1
kind: Namespace
metadata:
  name: intel-gpu
  labels:
    app.kubernetes.io/name: intel-gpu
    app.kubernetes.io/instance: intel-gpu
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-gpu
  namespace: intel-gpu
spec:
  path: clusters/titania/infra/intel-gpu-plugin
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: intel-gpu-plugin
      namespace: intel-gpu
