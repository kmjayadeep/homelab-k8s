apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  annotations:
    # Stateful: never let Flux garbage-collect this, even if the manifest is
    # renamed or removed. Deleting it must be a deliberate manual action.
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  path: clusters/titania/infra/longhorn
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
  - apiVersion: apps/v1
    kind: Daemonset
    name: longhorn-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-recurring
  namespace: longhorn-system
spec:
  path: clusters/titania/infra/longhorn/recurring
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
  - name: longhorn
    namespace: longhorn-system
