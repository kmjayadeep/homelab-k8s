apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-pki
  namespace: cert-manager
spec:
  path: clusters/titania/infra/vault-pki
  dependsOn:
  - name: cert-manager
    namespace: cert-manager
  - name: trust-manager
    namespace: cert-manager
  interval: 15m
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
