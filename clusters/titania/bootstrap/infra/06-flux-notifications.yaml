apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  path: clusters/titania/infra/flux-notifications
  interval: 15m
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: monitoring
      namespace: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
