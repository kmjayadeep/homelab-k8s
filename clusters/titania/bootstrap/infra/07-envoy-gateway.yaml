apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  path: clusters/titania/infra/envoy-gateway
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  interval: 15m
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway
      namespace: envoy-gateway-system
